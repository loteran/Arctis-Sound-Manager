telemetry_body=Vill du dela anonym användningsdata för att hjälpa till att förbättra Arctis Sound Manager?<br><br>Följande information skickas <b>en gång per dag</b>:<br>&nbsp ;&nbsp;• Your Linux distribution (e.g. Arch Linux, Ubuntu 24.04)<br>&nbsp;&nbsp;• Your headset model (e.g. Arctis Nova Pro Wired)<br>&nbsp;&nbsp;• The ASM version you are running<br><br><b>No personal data</b>, no IP address, no unique identifier.
