clips_install_packages_q=Installera inspelningspaketen?
clips_install_packages_hint=Clips behöver dessa, och de finns inte på datorn än: {0}
clips_install_venv=Clips kan inte köras från den här installationen av ASM. Den körs från en isolerad Python-miljö – en pipx- eller venv-installation – och PyGObject är ett systempaket som en sådan miljö inte kan se, hur många gånger det än installeras. Använd din distributions paket av ASM, eller skapa om miljön med --system-site-packages.
clips_install_partial_upgrade=Installationen misslyckades: datorns paket och dess förråd stämmer inte överens, så inspelningspaketen kan inte lösas upp. Uppdatera hela systemet först och försök sedan igen:
clips_removed=Borttagna: {0}
clips_removal_kept=Behölls, eftersom annan programvara på datorn fortfarande behöver dem: {0}
clips_install_title=Videoklipp
clips_install_intro=Spela in de senaste sekunderna av spelandet i bakgrunden och spara dem med en knapptryckning – med Spel, Chatt och Mikrofon på separata ljudspår, så att ett klipp kan mixas om i efterhand. Ett bibliotek, en klippredigerare och delning genom att dra till Discord ingår.
clips_install_intro2=Clips är valfritt: det kräver programvara för skärminspelning (GStreamer, PyGObject och ffmpeg) som en ren ljudinstallation inte har någon annan användning för, så det installeras bara när du ber om det här. Inget nedan rörs förrän du trycker på Installera.
