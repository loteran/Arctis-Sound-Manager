clips_remove_packages_hint=Dessa delas med resten av skrivbordet – videospelare och webbläsare använder också ffmpeg och GStreamer. Borttagningen tvingas inte, så pakethanteraren vägrar ta bort paket som något annat fortfarande behöver. Clips stängs av oavsett. Berörda: {0}
