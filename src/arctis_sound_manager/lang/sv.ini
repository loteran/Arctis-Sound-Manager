; udev_dialog
udev_write_title=Behörigheter för USB-enheten är inte konfigurerade
udev_write_body=De udev-regler som krävs för att komma åt ditt Arctis-headset utan root-behörighet saknas eller är ofullständiga. Utan dem kan tjänsten inte öppna USB-enheten (Error 13: Access denied). Klicka på ”Installera regler” för att åtgärda detta automatiskt (kräver administratörslösenord).
udev_write_btn=Installera regler
udev_reload_title=Behörigheter för USB-enheten har inte tillämpats
udev_reload_body=udev-reglerna är installerade, men den anslutna Arctis-enheten kopplades in innan de började gälla. Tjänsten kan inte öppna USB-enheten (Error 13: Access denied). Klicka på ”Verkställ nu” för att läsa in reglerna igen och tillämpa dem på den aktuella enheten (kräver administratörslösenord). Du kan också helt enkelt koppla ur och koppla in dongeln igen.
udev_reload_btn=Verkställ nu
; system_deps_dialog
sysdeps_header=Vissa nödvändiga komponenter saknas
sysdeps_sub=ASM-funktioner som är beroende av saknade systempaket fungerar inte förrän de är installerade. Den identifierade distributionen är {distro} – installationskommandona nedan passar den pakethanteraren. Varje installation ber om ditt administratörslösenord (via polkit).
; Shown instead of sysdeps_sub when ASM is running inside a container
; (distrobox/toolbox) and the host distribution is known — naming the
; container's own distro here would offer install commands for the wrong
; package manager, which is the exact bug reported on Bazzite.
sysdeps_sub_container=ASM körs i en {container_distro}-container på en {host_distro}-värd. Systempaket måste installeras på värden – installationerna nedan skickas dit automatiskt när det går och ber om administratörslösenordet för värden (via polkit).
; Same as sysdeps_sub_container, but the host distribution could not be
; identified — honest about that instead of asserting the container's.
sysdeps_sub_container_unknown_host=ASM körs i en {container_distro}-container och värddistributionen kunde inte fastställas. Systempaket måste installeras på värden — använd 'Kopiera kommando' och kör raden själv om en automatisk installation inte fungerar.
sysdeps_no_pkexec=pkexec hittades inte — installera polkit eller kopiera varje kommando manuellt.
sysdeps_container_no_host=Körs i en container utan åtkomst till värden — systempaket måste installeras direkt där. Använd 'Kopiera kommando' och kör varje rad i en terminal på värden.
; {host} = host distro id (e.g. "bazzite"), {script} = scripts/distrobox/*.sh filename.
; The script handles the install path on the immutable host. For udev rules
; it writes the rules on the host; for other HOST-scope deps (LADSPA, polkit)
; the script also covers those on the distros it supports. A user copying the
; line gets a distrobox-host-exec bash one-liner that runs on the host.
sysdeps_immutable_host={host} är ett oföränderligt OS — kör distrobox-skriptet på värden i stället ; it installs the missing system dependencies and is kept up to date.
sysdeps_immutable_blocked={host} är oföränderligt — kör distrobox-skriptet på värden för: {names}.
sysdeps_no_path_for=Inget installationssätt på den här distributionen för: {names} — använd 'Kopiera kommando' på varje rad i stället.
dep_breaks=Påverkar: {feature}
dep_note=Obs: {note}
skip_until_upgrade=Visa inte igen förrän ASM har uppgraderats
all_checks_pass=Alla blockerande och försämrande kontroller godkänns nu — du kan stänga den här dialogen.
; {count} = number of issues. Both forms must be translated on Crowdin.
issue_count_one={count} problem hittades. Använd 'Installera allt som saknas' för en enda polkit-fråga, eller åtgärda punkterna en och en.
issue_count_other={count} problem hittades. Använd 'Installera allt som saknas' för en enda polkit-fråga, eller åtgärda punkterna en och en.
; report_dialog
report_bug=Rapportera en bugg
report_crash_title=En krasch inträffade under förra sessionen
report_crash_sub=ASM stötte på ett oväntat fel. Klicka på ”Öppna GitHub-ärende” för att skicka en rapport — en kort sammanfattning öppnas i webbläsaren och en fullständig diagnostikfil sparas lokalt som du kan dra och släppa i ärenderedigeraren.
report_bug_sub=Klicka på ”Öppna GitHub-ärende” för att börja skriva en rapport. En kort sammanfattning öppnas i webbläsaren ; a full diagnostic file (USB tree, udev rules, PA/PW sinks, journalctl, etc.) is saved locally — drag-and-drop it into the GitHub editor as an attachment.
report_desc_hint=Beskriv vad som hände (steg för att återskapa, förväntat mot faktiskt resultat):
report_desc_placeholder=Exempel: ”Jag klickade på fliken Sonar, bytte till förinställningen Bass Boost och kanalen Spel blev tyst tills jag startade om ASM.” (Valfritt men mycket hjälpsamt — lämna tomt om du inte har mer att tillägga.)
report_preview_hint=Förhandsgranskning av den fullständiga diagnostiken som skickas:
