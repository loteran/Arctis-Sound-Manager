clips_pkg_failed=Le gestionnaire de paquets a refusé. Rien n'a été modifié.
clips_remove_packages_q=Supprimer aussi les paquets installés par Clips ?
clips_remove_packages_hint=Ils sont partagés avec le reste de votre bureau : les lecteurs vidéo et les navigateurs utilisent aussi ffmpeg et GStreamer. La suppression n'est pas forcée, donc votre gestionnaire de paquets refusera de retirer un paquet dont autre chose a encore besoin. Clips est désactivé dans tous les cas. Concernés : {0}
clips_uninstall_tooltip=Désactiver Clips et, si vous le souhaitez, supprimer les paquets qu'il a installés. Vos clips enregistrés ne sont pas touchés.
clips_remove_command=La commande exécutée :
clips_remove_will_go=Seraient supprimés : {0}
clips_remove_held=Seraient conservés, car d'autres logiciels en ont encore besoin :
clips_remove_packages=Supprimer les paquets
clips_install_command=La commande exécutée :
clips_install_packages_q=Installer les paquets de capture ?
clips_install_packages_hint=Clips en a besoin, et ils ne sont pas encore sur cette machine : {0}
clips_install_venv=Clips ne peut pas fonctionner avec cette installation d'ASM. Elle tourne dans un environnement Python isolé (installation pipx ou venv), et PyGObject est un paquet système qu'un tel environnement ne voit pas, quel que soit le nombre de fois où on l'installe. Utilisez le paquet ASM de votre distribution, ou recréez l'environnement avec --system-site-packages.
clips_install_partial_upgrade=Échec de l'installation : les paquets de cette machine et ses dépôts ne concordent pas, donc les paquets de capture ne peuvent pas être résolus. Mettez d'abord tout le système à jour, puis réessayez :
clips_removed=Supprimés : {0}
clips_removal_kept=Conservés, car d'autres logiciels de cette machine en ont encore besoin : {0}
clips_install_title=Clips vidéo
clips_install_intro=Enregistre en arrière-plan les dernières secondes de jeu et les sauvegarde d'une touche, avec Jeu, Chat et Micro sur des pistes audio séparées pour pouvoir remixer le clip ensuite. Une bibliothèque, un éditeur de découpe et le partage par glisser-déposer vers Discord sont inclus.
clips_install_intro2=Clips est facultatif : il a besoin de logiciels d'enregistrement d'écran (GStreamer, PyGObject et ffmpeg) qui ne servent à rien d'autre dans une installation purement audio. Il n'est donc installé que si vous le demandez ici. Rien n'est modifié tant que vous n'avez pas cliqué sur Installer.
clips_install_what=Ce qui sera installé
clips_install_manual=Vous préférez les installer vous-même ? Lancez ceci dans un terminal, puis cliquez sur « Je l'ai installé » :
