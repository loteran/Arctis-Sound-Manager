clips_enable_setting=Clips — enregistrer les dernières secondes de l'écran
clips_enable_tooltip=Désactivé par défaut : la capture de clips a besoin de GStreamer, PyGObject et ffmpeg, contrairement au mixeur et à l'égaliseur. L'activer propose de les installer.
