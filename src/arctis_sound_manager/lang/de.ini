clips_install_failed=Installation fehlgeschlagen: {0}
clips_install_still_missing=Einige Komponenten fehlen noch – prüfen Sie die Liste oben. Eventuell müssen Sie ein Terminal öffnen und den angezeigten Befehl ausführen.
