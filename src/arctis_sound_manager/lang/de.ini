clips_remove_packages_hint=Diese werden auch vom Rest Ihres Desktops genutzt – Videoplayer und Browser verwenden ebenfalls ffmpeg und GStreamer. Das Entfernen wird nicht erzwungen, daher verweigert die Paketverwaltung jedes Paket, das noch benötigt wird. Clips wird in jedem Fall ausgeschaltet. Betroffen: {0}
clips_uninstall_tooltip=Clips ausschalten und optional die installierten Pakete entfernen. Ihre gespeicherten Clips bleiben erhalten.
