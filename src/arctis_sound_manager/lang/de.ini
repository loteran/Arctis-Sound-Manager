clips_enable_setting=Clips – die letzten Sekunden des Bildschirms aufnehmen
clips_enable_tooltip=Standardmäßig aus: Die Clip-Aufnahme braucht GStreamer, PyGObject und ffmpeg, der Mixer und der Equalizer nicht. Beim Einschalten wird die Installation angeboten.
