clips_install_packages_q=Aufnahmepakete installieren?
clips_install_packages_hint=Clips braucht diese Pakete, sie sind noch nicht auf diesem Rechner: {0}
clips_install_venv=Clips kann mit dieser ASM-Installation nicht laufen. Sie läuft in einer isolierten Python-Umgebung (pipx- oder venv-Installation), und PyGObject ist ein Systempaket, das eine solche Umgebung nicht sieht, egal wie oft es installiert wird. Verwenden Sie das ASM-Paket Ihrer Distribution oder erstellen Sie die Umgebung mit --system-site-packages neu.
clips_install_partial_upgrade=Installation fehlgeschlagen: Die Pakete dieses Rechners und seine Paketquellen passen nicht zusammen, daher lassen sich die Aufnahmepakete nicht auflösen. Aktualisieren Sie zuerst das ganze System und versuchen Sie es dann erneut:
clips_removed=Entfernt: {0}
clips_removal_kept=Behalten, weil andere Software auf diesem Rechner sie noch braucht: {0}
clips_install_title=Videoclips
clips_install_intro=Nimmt im Hintergrund die letzten Sekunden des Spiels auf und speichert sie per Tastendruck – mit Spiel, Chat und Mikrofon auf getrennten Tonspuren, sodass ein Clip später neu abgemischt werden kann. Eine Bibliothek, ein Schnitteditor und Teilen per Ziehen nach Discord sind dabei.
clips_install_intro2=Clips ist optional: Es braucht Software für Bildschirmaufnahmen (GStreamer, PyGObject und ffmpeg), die eine reine Audio-Installation sonst nicht nutzt. Daher wird es nur installiert, wenn Sie es hier anfordern. Nichts wird verändert, bevor Sie auf Installieren klicken.
clips_install_what=Was installiert wird
clips_install_manual=Lieber selbst installieren? Führen Sie dies in einem Terminal aus und klicken Sie dann auf „Ich habe es installiert“:
