device:
  name: SteelSeries Arctis Pro Wireless
  # GG's own minimum spacing between commands for this firmware family.
  time_between_commands_ms: 35
  # GG's own wait after the transmitter enumerates before sending it any
  # command at all (init-sleep-length).
  init_sleep_length_ms: 1500
  vendor_id: 0x1038
  product_ids:
    - 0x1290 # Arctis Pro Wireless (HID: the base's command channel)
  # The base's second USB device: the ALSA card, no vendor channel (GG's
  # sshz_dtshpx_endpoint_vidpid). Its interface 0 is AudioControl, and taking
  # it from snd-usb-audio removes the sound card (#365).
  audio_product_ids:
    - 0x1294
  command_padding:
    length: 31
    position: end
    filler: 0x00

  # Standard HID interface 0 — uses ctrl_transfer SET_REPORT (OUTPUT type)
  # All commands end with 0xAA suffix (base-station protocol).
  command_transport: ctrl_output

  # No hid_usage_page here on purpose. The value that used to be here came from
  # the spec's `(sync-interface ...)`, which is a different declaration from
  # `(usage-page ...)`: the first names the interface that pushes events, the
  # second the interface commands go to. SteelSeries' own engine treats them as
  # two primitives taking different arguments. Naming the sync interface's page
  # as the command interface's is what shipped 1.4.10 (#216, #217). Absent is
  # honest here; a wrong page would be used to choose between vendor interfaces.

  command_interface_index: [0, 0]
  listen_interface_indexes: [0]

  device_init:
    - ['status.request']
    - [0x39, 0xaa, 'settings.mic_side_tone']
    - [0x3c, 0xaa, 'settings.pm_shutdown']
    - [0x90, 0xaa]  # save

  # siberia-840 spec (the base this profile's firmware API includes):
  # 0x41aa rf_status   -> [rf_mode, rf_status, ...]  rf_mode 4 = headset linked
  # 0x40aa battery_status -> [battery_level, ...]
  # 0x42aa charger_status -> [battery_level, ...]  the spare in the base's slot
  # Hardware capture: [4, 2, 0, ...] online, [2, 2, 0, ...] offline. byte[1]
  # is rf_status, not the battery: read as such it stuck at 2/4 = 50% (#305).
  # Neither reply echoes its command, hence reply_to instead of starts_with.
  status:
    request: 0x41aa
    extra_requests:
      - 0x40aa
      - 0x42aa
    response_mapping:
      - reply_to: 0x41aa
        starts_with: 0x04
        headset_power_status: 0x00

      - reply_to: 0x41aa
        starts_with: 0x02
        headset_power_status: 0x00

      - reply_to: 0x40aa
        headset_battery_charge: 0x00

      # 0x42aa is not the spare battery's level, whatever the spec calls the
      # field: on hardware it reads 0 with the slot empty and 3, then 4, once
      # a battery is in, the base showing 2 bars of 4 meanwhile (#363;
      # chameth.com saw the same 04 / 00). Only "a battery is in the base"
      # is known, so that is all ASM shows.
      - reply_to: 0x42aa
        charge_slot_battery: 0x00

    representation:
      headset:
        - headset_power_status
        - headset_battery_charge
      gamedac:
        - charge_slot_battery

  online_status:
    status_variable: headset_power_status
    online_value: online

  audio:
    spatial_engine: hesuvi

  # Read-only queries for `asm-cli tools probe` (generated from the
  # spec by gg_draft.py): their raw replies check a spec layout
  # on real hardware in one pass. Constants only — nothing is set.
  probe_queries:
    - name: get_mode_setting
      frame: [0x15]
      fields: {mode: 1}
    - name: get_settings
      frame: [0x12]
    - name: battery_status
      frame: [0x40]
    - name: rf_status
      frame: [0x41]
    - name: charger_status
      frame: [0x42]
    - name: read_onboard_profile_0
      frame: [0x82, 0x00]
    - name: read_onboard_eq_0
      frame: [0x84, 0x00]
    - name: read_source_0
      frame: [0x86, 0x00]

  settings:
    microphone:
      mic_side_tone:
        type: slider
        min: 0x00
        max: 0x09
        step: 1
        min_label: off
        max_label: perc_100
        default: 0x00
        update_sequence: [0x39, 0xaa, 'value']
      mic_led_brightness:
        # mute_mic_brightness (0x3E): the muted-mic LED, 0-10 as in GG.
        type: slider
        min: 0x00
        max: 0x0a
        step: 1
        min_label: perc_0
        max_label: perc_100
        default: 0x0a
        update_sequence: [0x3e, 0xaa, 'value']
    power_management:
      # Value sent in 10-minute increments (minutes / 10).
      pm_shutdown:
        type: button_group
        values_mapping:
          0x00: never
          0x01: 10_minutes
          0x02: 20_minutes
          0x03: 30_minutes
          0x06: 60_minutes
          0x09: 90_minutes
        default: 0x03
        update_sequence: [0x3c, 0xaa, 'value']
    station:
      # oled_brightness in arctis-pro-wireless.device: command 0x85, the
      # usual 0xAA check byte, level 0-10.
      station_screen_brightness:
        type: slider
        min: 0x00
        max: 0x0a
        step: 1
        min_label: perc_0
        max_label: perc_100
        default: 0x0a
        update_sequence: [0x85, 0xaa, 'value']
      # The four below are what GG's page for this base station offers next
      # to the brightness (GG 122), frames [command, 0xAA, value] from the
      # spec (arctis-pro-wireless.device). Not yet tried on a real one.
      station_screensaver:
        # screensaver_mode (0x89): GG's dim / screen off / screensaver.
        type: button_group
        default: 0x00
        update_sequence: [0x89, 0xaa, 'value']
        values_mapping:
          0x00: dimm
          0x01: screen_off
          0x02: screensaver
      station_screen_saver_timeout:
        # display_timeout (0x60): tens of seconds, 3-60 (30 s to 10 min),
        # every value GG lists.
        type: slider
        min: 3
        max: 60
        step: 3
        min_label: 30_seconds
        max_label: 10_minutes
        default: 30
        update_sequence: [0x60, 0xaa, 'value']
    headset:
      volume_limiter:
        # volume_limiter (0x27): GG's toggle, 1 limited / 0 unlimited.
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: unlimited
          on_label: limited
        default: 0x00
        update_sequence: [0x27, 0xaa, 'value']
    bluetooth:
      bluetooth_power_status:
        # bt_startup_mode (0x62): Bluetooth on when the base powers up.
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00
        update_sequence: [0x62, 0xaa, 'value']
      bluetooth_auto_mute:
        # bt_gamemute_pref (0x63): mute game audio during a Bluetooth call.
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00
        update_sequence: [0x63, 0xaa, 'value']

  # The screen is drawn by the included siberia-840 spec, not this file:
  # 0xD0/0xD1 take it, 0xD2 sends a whole 128x48 frame in one 1025-byte
  # Feature report on interface 0. See oled_protocol.SiberiaOledProtocol.
  # `packing` is GG's `convert-to-column-packed-byte-format`, whose bit layout
  # the spec does not give: column_msb drew noise on hardware (#305). Until
  # oled_geometry_probe.py tells how bytes map to pixels, ASM leaves it to
  # the base (`verified: false`).
  oled:
    protocol: siberia_840
    interface: 0
    report_id: 0x00
    wvalue: 0x0300
    width: 128
    height: 48
    frame_report_size: 1025
    control_report_size: 33
    # GG's layout (8-row pages, bit 0 = top), confirmed on hardware by
    # oled_page_probe.py: variants 1-3 right, the bit-flipped 4 wrong (#363,
    # #305). The old column_msb drew the "garbled lines".
    packing: page_lsb
    verified: true

  status_parse:
    headset_power_status:
      type: int_str_mapping
      values:
        0x02: offline
        0x04: online
    headset_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 4
    charge_slot_battery:
      type: int_str_mapping
      values:
        0x00: no_battery
        0x01: battery_in_base
        0x02: battery_in_base
        0x03: battery_in_base
        0x04: battery_in_base
