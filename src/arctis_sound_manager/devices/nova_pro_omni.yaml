# ── Arctis Nova Pro Omni (0x2290) ─────────────────────────────────────────────
#
# Protocol facts below were validated on real hardware and cross-checked against
# three independent sources (see PR #147, @joorklee):
#   • a live Windows USBPcap capture of SteelSeries GG driving this exact DAC,
#   • GG's own device specification for the Omni (arctis_nova_pro_omni_tx +
#     base_arctis_nova_elite_tx),
#   • direct Linux pyusb tests, with writes confirmed by device readback and on
#     the DAC's own screen.
#
# ── IMPORTANT: the DAC has a physical USB-1 / USB-2 / XBOX mode switch ────────
#   • USB-1 → enumerates as 1038:2290 — THIS config (full SteelSeries protocol)
#   • USB-2 → enumerates as 1038:2292 — UAC audio + HID, but the SteelSeries
#             control protocol is silent there (nothing to drive)
#   • XBOX  → enumerates as 1038:2293 — Xbox GIP protocol, NOT SteelSeries
# Only 0x2290 is declared here on purpose: on the other two positions the DAC
# would be detected and then never answer. A "no response from the Omni" report
# (#70 style) should start by checking the switch position.
#
# ── USB layout ───────────────────────────────────────────────────────────────
# The Omni's HID interfaces differ from the Nova Pro Wireless:
#   • Nova Pro Wireless — interface 4: EP 0x84 IN (64B) + EP 0x04 OUT (64B).
#   • Nova Pro Omni     — interface 3: EP 0x83 IN (64B), and NO Interrupt OUT.
#                         interface 4 only carries a 2-byte IN (consumer keys).
#
# ── Transport (verified byte-for-byte against GG) ────────────────────────────
# No Interrupt OUT endpoint → commands are HID SET_REPORT control transfers
# (bmRequestType 0x21, bRequest 0x09, wValue 0x0201 = Output report + report
# id 1, wIndex 3), 64-byte reports: byte 0 = report id 0x01, byte 1 = opcode.
# wValue matters — the DAC ignores commands sent with a mismatched report id,
# which is why several controls used to have no audible effect at all.
# Query replies and async push events arrive on Interrupt IN EP 0x83: replies
# are prefixed 0x01 <opcode>, async events 0x07 <opcode>.
# ──────────────────────────────────────────────────────────────────────────────
device:
  name: SteelSeries Arctis Nova Pro Omni
  vendor_id: 0x1038
  product_ids:
    - 0x2290 # SteelSeries Arctis Nova Pro Omni (DAC switch in USB-1 position)

  # The other two switch positions, named so the daemon can say what is
  # actually wrong. Without this the Omni in USB-2 enumerates as a PID no
  # YAML claims, and ASM told its owner to open an issue for an unsupported
  # headset — which is how #218 was filed for a switch in the wrong position.
  known_unsupported_product_ids:
    0x2292: "the DAC's mode switch is in the USB-2 position, where the SteelSeries control protocol is silent — set it to USB-1"
    0x2293: "the DAC's mode switch is in the XBOX position, which speaks the Xbox GIP protocol, not SteelSeries — set it to USB-1"
  command_padding:
    length: 64
    position: end
    filler: 0x00

  # Control/data interface = 3 (64-byte Interrupt IN on EP 0x83); interface 4 is
  # the 2-byte consumer-control endpoint. Confirmed via asm-cli tools arctis-devices.

  # No hid_usage_page here on purpose. The value that used to be here came from
  # the spec's `(sync-interface ...)`, which is a different declaration from
  # `(usage-page ...)`: the first names the interface that pushes events, the
  # second the interface commands go to. SteelSeries' own engine treats them as
  # two primitives taking different arguments. Naming the sync interface's page
  # as the command interface's is what shipped 1.4.10 (#216, #217). Absent is
  # honest here; a wrong page would be used to choose between vendor interfaces.

  command_interface_index: [3, 0] # bInterfaceNumber, bAlternateSetting
  listen_interface_indexes: [3]   # bInterfaceNumber (status read on EP 0x83)

  # No Interrupt OUT endpoint on the HID interfaces → commands via HID SET_REPORT
  # (control transfer to interface 3), like the Nova Pro Wired.
  command_transport: ctrl_output
  command_report_id: 0x01 # → wValue 0x0201, exactly what GG sends

  # Init follows the GG session chronology: handshake, state queries, then the
  # user's stored settings. Only opcodes present in the Omni's own spec are sent
  # (the previous burst carried Nova Pro Wireless leftovers — 0x33, 0x2e, 0x3b,
  # 0x69, 0x83, 0xb7, 0xc3 — that this DAC does not implement).
  # Two things GG does here are deliberately NOT replayed:
  #   • 0x09 save_to_flash after each deploy — pointless flash wear on every start,
  #   • fixed stream-mix / line-out / Bluetooth values — those are the user's
  #     state, not ours to overwrite at boot.
  device_init:
    - [0x01, 0x8d, 0x01]                           # set_sonar_present ON
    - [0x01, 0x49, 0x01]                           # software chatmix ON
    - [0x01, 0x20]                                 # audio_settings query
    - [0x01, 0x10]                                 # fw_versions query
    - [0x01, 0x80]                                 # ux_settings query
    - ['status.request']                           # wireless_settings (0x01b0)
    - [0x01, 0xc1, 'settings.pm_shutdown']         # inactivity timer
    - [0x01, 0xbd, 'settings.noise_cancelling']    # 0 off / 1 transparent / 2 ANC
    - [0x01, 0xb8, 'settings.anc_level']           # ANC level 1-3
    - [0x01, 0xb9, 'settings.transparent_level']   # transparency level 1-10
    - [0x01, 0x37, 'settings.mic_volume']          # mic volume 1-10
    - [0x01, 0x38, 'settings.mic_side_tone.enabled', 'settings.mic_side_tone.at_least_1'] # boom sidetone: state (0/1) + level 1-10
    - [0x01, 0xbf, 'settings.mic_led_brightness']  # muted-mic LED brightness 1-10
    - [0x01, 0x27, 'settings.volume_limiter']      # volume limiter
    - [0x01, 0xb2, 'settings.bluetooth_power_status']  # BT on at power-up
    - [0x01, 0xb3, 'settings.bluetooth_auto_mute']     # what a call does to game audio
    - ['status.request']

  status:
    request: 0x01b0
    response_mapping:
      # ── Async push events (0x07 prefix) ──
      - starts_with: 0x0725
        station_volume: 0x02

      - starts_with: 0x0731
        eq_band_index: 0x02
        eq_band_value: 0x03

      - starts_with: 0x0737
        mic_volume: 0x02

      - starts_with: 0x0745
        media_mix: 0x02
        chat_mix: 0x03

      - starts_with: 0x07b5        # radio + Bluetooth link event
        bluetooth_power_status: 0x02
        bluetooth_connection: 0x03
        wireless_pairing: 0x04
        headset_power_status: 0x04 # same byte, read as on/off (see below)

      - starts_with: 0x07b7        # battery event
        headset_battery_charge: 0x02
        charge_slot_battery_charge: 0x03
        charging_status: 0x04

      - starts_with: 0x07b8
        anc_level: 0x02

      - starts_with: 0x07b9
        transparent_noise_cancelling_level: 0x02

      - starts_with: 0x07bb        # mic mute event
        mic_status: 0x02

      - starts_with: 0x07bd
        noise_cancelling: 0x02

      # ── Main 0x01b0 wireless_settings reply — byte layout per the GG spec ──
      # The old layout stopped at 0x0f and read it as the headset power state;
      # 0x0f is in fact the charging state, and the headset's on/off state is
      # carried by the pairing byte at 0x0e. Both names are mapped onto 0x0e so
      # the rest of ASM (tray battery icon, OLED, routing fallback) keeps
      # finding headset_power_status where it expects it.
      - starts_with: 0x01b0
        bluetooth_powerup_state: 0x02   # bt_power_default (0/1)
        bluetooth_auto_mute: 0x03       # bt_call_default (0=nothing 1=-12dB 2=mute)
        bluetooth_power_status: 0x04    # bt_connection_mode (1=off 2=pairing 4=link)
        bluetooth_connection: 0x05      # bt_connection_status (1=ready 2=lost 4=busy 8=error)
        headset_battery_charge: 0x06    # 0-100
        charge_slot_battery_charge: 0x07
        transparent_noise_cancelling_level: 0x08 # 1-10
        mic_status: 0x09                # 0=unmuted 1=muted
        noise_cancelling: 0x0a          # 0=off 1=transparent 2=ANC
        mic_led_brightness: 0x0b        # 1-10
        auto_off_time_minutes: 0x0c     # 0-6 (mapped)
        wireless_mode: 0x0d             # 0=speed 1=range
        wireless_pairing: 0x0e          # 1=unpaired 2=searching 4=paired-offline 8=connected
        headset_power_status: 0x0e      # same byte, read as on/off
        charging_status: 0x0f           # 1=unknown 2=charging 4=plugged-not-charging 8=discharging
        anc_level: 0x10                 # 1-3
    representation:
      headset:
        - headset_power_status
        - headset_battery_charge
        - charging_status
        - noise_cancelling
        - anc_level
        - transparent_noise_cancelling_level
        - auto_off_time_minutes
      mic:
        - mic_status
        - mic_volume
        - mic_led_brightness
      gamedac:
        - station_volume
        - charge_slot_battery_charge
      bluetooth:
        - bluetooth_powerup_state
        - bluetooth_power_status
        - bluetooth_auto_mute
        - bluetooth_connection
      wireless:
        - wireless_mode
        - wireless_pairing

  online_status:
    status_variable: headset_power_status
    online_value: online

  audio:
    spatial_engine: hesuvi

  # OLED: 128x64 panel on the DAC. draw_bitmap (opcode 0x93) goes over SET_REPORT
  # Feature reports (wValue 0x0301 = Feature + report id 1), interface 3,
  # column-packed 1bpp — confirmed rendering on the DAC screen.
  oled:
    interface: 3       # HID interface carrying the OLED control endpoint
    report_id: 0x01    # First byte of every HID report sent to the OLED
    wvalue: 0x0301     # SET_REPORT wValue: 0x0301 = HID Feature report, id 1
    width: 128         # Panel width in pixels
    height: 64         # Panel height in pixels

  settings:
    bluetooth:
      # The DAC's own Bluetooth preferences, both plain writes per the spec.
      # Their current values are already read back in the 0x01b0 status frame
      # (bluetooth_powerup_state / bluetooth_auto_mute), so the controls and
      # the readout stay in step.
      bluetooth_power_status:
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00
        update_sequence: [0x01, 0xb2, 'value']
      bluetooth_auto_mute:
        # bt_call_default: what the DAC does to game audio on an incoming call.
        type: button_group
        values_mapping:
          0x00: none
          0x01: -12_db
          0x02: mute
        default: 0x00
        update_sequence: [0x01, 0xb3, 'value']
    headset:
      # 0x27 is the volume limiter, not a gain stage (renamed from 'gain').
      volume_limiter:
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: unlimited
          on_label: limited
        default: 0x00 # unlimited — what GG deploys
        update_sequence: [0x01, 0x27, 'value']
    microphone:
      mic_volume:
        type: slider
        min: 0x01
        max: 0x0a
        step: 1
        min_label: mic_muted
        max_label: perc_100
        default: 0x0a # 100%
        update_sequence: [0x01, 0x37, 'value']
      mic_side_tone:
        # boom_mic_sidetone (0x38): byte 2 = state (0/1), byte 3 = level 1-10.
        # The slider spans 0-10: 0 writes state=0 (a true off, #161 — before
        # this the state byte was hardcoded on, so the sidetone could never be
        # disabled), 1-10 write state=1 with that level. The level byte is
        # pinned to >= 1 even when off (value.at_least_1) because the firmware
        # misbehaves on a 0 level. (0x18 — used before 0x38 — was
        # read_radio_eq_name, a query: it applied no sidetone at all.)
        type: slider
        min: 0x00
        max: 0x0a
        step: 1
        min_label: off
        max_label: perc_100
        default: 0x00
        update_sequence: [0x01, 0x38, 'value.enabled', 'value.at_least_1']
      mic_led_brightness:
        type: slider
        min: 0x01
        max: 0x0a
        step: 1
        min_label: perc_10
        max_label: perc_100
        default: 0x0a # 100%
        update_sequence: [0x01, 0xbf, 'value']
      mic_noise_reduction:
        # Noise reduction done inside the DAC (0x3C), on the boom microphone.
        # The frame is [0x3C, which_mics, boom_level, on_ear_level]: the first
        # byte tells the firmware which microphones are being adjusted (0 none,
        # 1 boom, 16 on-ear, 17 both) and the levels must stay >= 1 even when
        # off, which is why the derived tokens exist. The on-ear microphone is
        # left alone, hence its level pinned to 1 and never selected.
        type: button_group
        values_mapping:
          0x00: off
          0x01: low
          0x02: medium
          0x03: high
        default: 0x00
        update_sequence: [0x01, 0x3c, 'value.enabled', 'value.at_least_1', 0x01]
    power_management:
      pm_shutdown:
        type: slider
        min: 0x00
        max: 0x06
        step: 1
        min_label: never
        max_label: 60_minutes
        values_mapping:
          0x00: never
          0x01: 1_minutes
          0x02: 5_minutes
          0x03: 10_minutes
          0x04: 15_minutes
          0x05: 30_minutes
          0x06: 60_minutes
        default: 0x05 # 30 minutes
        update_sequence: [0x01, 0xc1, 'value']
    audio:
      noise_cancelling:
        type: slider
        hidden: true
        min: 0x00
        max: 0x02
        step: 1
        default: 0x00 # off
        update_sequence: [0x01, 0xbd, 'value']
      anc_level:
        type: slider
        hidden: true
        min: 0x01
        max: 0x03
        step: 1
        default: 0x03 # high
        update_sequence: [0x01, 0xb8, 'value']
      transparent_level:
        type: slider
        hidden: true
        min: 0x01
        max: 0x0a
        step: 1
        default: 0x05
        update_sequence: [0x01, 0xb9, 'value']

  status_parse:
    station_volume:
      type: percentage
      perc_min: 56
      perc_max: 0
    media_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    chat_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    mic_volume:
      type: percentage
      perc_min: 1
      perc_max: 10
    bluetooth_powerup_state:
      type: on_off
      off: 0x00
      on: 0x01
    bluetooth_auto_mute:
      type: int_str_mapping
      values:
        0x00: off
        0x01: -12db
        0x02: on
    bluetooth_power_status:
      type: int_str_mapping
      values:
        0x01: off
        0x02: pairing
        0x04: on
    bluetooth_connection:
      type: int_str_mapping
      values:
        0x01: connected
        0x02: disconnected
        0x04: busy
        0x08: error
    headset_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 100
    charge_slot_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 100
    transparent_noise_cancelling_level:
      type: percentage
      perc_min: 0
      perc_max: 10
    mic_status:
      type: int_str_mapping
      values:
        0x01: muted
        0x00: unmuted
    noise_cancelling:
      type: int_str_mapping
      values:
        0x00: off
        0x01: transparent
        0x02: on
    anc_level:
      type: int_str_mapping
      values:
        0x01: low
        0x02: medium
        0x03: high
    mic_led_brightness:
      type: percentage
      perc_min: 0
      perc_max: 10
    auto_off_time_minutes:
      type: int_int_mapping
      values:
        0x00: 0
        0x01: 1
        0x02: 5
        0x03: 10
        0x04: 15
        0x05: 30
        0x06: 60
    wireless_mode:
      type: int_str_mapping
      values:
        0x00: speed
        0x01: range
    wireless_pairing:
      type: int_str_mapping
      values:
        0x01: not_paired
        0x02: searching
        0x04: paired_offline
        0x08: connected
    charging_status:
      type: int_str_mapping
      values:
        0x01: unknown
        0x02: charging
        0x04: plugged_not_charging
        0x08: discharging
    # Same byte as wireless_pairing, in the on/off vocabulary the rest of ASM
    # speaks (power_status.normalize_power_value): the headset is reachable only
    # once the radio link is up.
    headset_power_status:
      type: int_str_mapping
      values:
        0x01: offline
        0x02: offline
        0x04: offline
        0x08: online
