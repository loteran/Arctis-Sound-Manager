device:
  name: SteelSeries Arctis 9 Wireless
  # GG's own minimum spacing between commands for this firmware family.
  time_between_commands_ms: 20
  # GG's own wait after the transmitter enumerates before sending it any
  # command at all (init-sleep-length).
  init_sleep_length_ms: 200
  # GG's own retry delay for a status read after the wireless headset
  # reconnects its radio link (up to 10 attempts) instead of trusting a
  # single flat settle time before replaying settings. This family reuses
  # init-sleep-length as the retry delay too (same value, same spec).
  radio_reconnect_probe_delay_ms: 200
  vendor_id: 0x1038
  product_ids:
    - 0x12c2 # Arctis 9
  command_padding:
    length: 31
    position: end
    filler: 0x00

  # Standard HID interface 0 — uses ctrl_transfer SET_REPORT (OUTPUT type)
  # NOTE: sidetone uses exponential mapping (0xC0-0xFD), not linear.
  # The values below are device-native and do not map linearly to audible levels.
  command_transport: ctrl_output

  # No hid_usage_page here on purpose. The value that used to be here came from
  # the spec's `(sync-interface ...)`, which is a different declaration from
  # `(usage-page ...)`: the first names the interface that pushes events, the
  # second the interface commands go to. SteelSeries' own engine treats them as
  # two primitives taking different arguments. Naming the sync interface's page
  # as the command interface's is what shipped 1.4.10 (#216, #217). Absent is
  # honest here; a wrong page would be used to choose between vendor interfaces.

  command_interface_index: [0, 0]
  listen_interface_indexes: [0]

  device_init:
    - ['status.request']
    - [0x06, 0x00, 'settings.mic_side_tone']
    - [0x04, 0x00, 'settings.pm_shutdown.minutes_as_seconds_hi', 'settings.pm_shutdown.minutes_as_seconds_lo']
    - [0x90, 0x00]  # save

  # info_table (spec arctis-9-tx): the reply does not echo 0x20, it starts
  # with `ready` — ready, rf_status, battery voltage hi/lo, bat_status,
  # mic_mute, mic_gain, sidetone_enabled, sidetone_gain, chat_gain,
  # game_gain, mode. A probe (#331) read `aa 03 01 9c … e8`, sidetone
  # included, so the offsets hold; `starts_with: 0x20` never matched it.
  # The battery reads the voltage's low byte over 0x64-0x9a, the range the
  # mainline driver and HeadsetControl use.
  status:
    request: 0x0020
    response_mapping:
      - reply_to: 0x0020
        headset_battery_charge: 0x03
        headset_power_status: 0x01
        chat_mix: 0x09
        media_mix: 0x0a

    representation:
      headset:
        - headset_power_status
        - headset_battery_charge
        - chat_mix
        - media_mix

  online_status:
    status_variable: headset_power_status
    online_value: online

  audio:
    spatial_engine: hesuvi

  # Read-only queries for `asm-cli tools probe` (generated from the
  # spec by gg_draft.py): their raw replies check a spec layout
  # on real hardware in one pass. Constants only — nothing is set.
  probe_queries:
    - name: get_eq
      frame: [0x13, 0x00]
    - name: get_sidetone_gain
      frame: [0x16, 0x00]
    - name: get_surround
      frame: [0x17, 0x00]
    - name: get_surround_source
      frame: [0x1d, 0x00]
    - name: get_microphone_gain
      frame: [0x15, 0x00]
    - name: get_inactivity_timer
      frame: [0x14, 0x00]
    - name: info_table
      frame: [0x20, 0x00]

  settings:
    microphone:
      # Values are device-native exponential bytes (0xC0=off, 0xFD=max).
      # Expose as 4 discrete levels mapped to the correct device values.
      mic_side_tone:
        type: button_group
        values_mapping:
          0xc0: off
          0xd5: low
          0xe8: medium
          0xfd: high
        default: 0xc0
        update_sequence: [0x06, 0x00, 'value']
    power_management:
      # Chosen in minutes; the firmware takes seconds, big-endian on two
      # bytes (spec inactivity_timer). Sending the minutes as is turned
      # "90 minutes" into 90 seconds (#331).
      pm_shutdown:
        type: button_group
        values_mapping:
          0x00: never
          0x0a: 10_minutes
          0x0f: 15_minutes
          0x1e: 30_minutes
          0x3c: 60_minutes
          0x5a: 90_minutes
        default: 0x1e
        update_sequence: [0x04, 0x00, 'value.minutes_as_seconds_hi', 'value.minutes_as_seconds_lo']

  status_parse:
    # rf_status: 0x01 is connected. The mainline driver (hid-steelseries-
    # arctis, from HeadsetControl's hardware work) reads 0x03 as a stale
    # status left by a headset that is off, and the probe's 0x03 frame
    # carried an out-of-range battery (0x9c > 0x9a) to match.
    headset_power_status:
      type: int_str_mapping
      values:
        0x00: 'off'
        0x01: 'on'
        0x03: 'off'
    headset_battery_charge:
      type: percentage
      perc_min: 100
      perc_max: 154
    # chat_gain / game_gain are attenuation steps: 0 is full volume, 19 the
    # far end of the dial (HeadsetControl: dial centred = both 0). Read the
    # other way round, the centre showed as 0 % / 0 % and any turn as 100 %
    # one side (#352, #331).
    media_mix:
      type: percentage
      perc_min: 19
      perc_max: 0
    chat_mix:
      type: percentage
      perc_min: 19
      perc_max: 0
