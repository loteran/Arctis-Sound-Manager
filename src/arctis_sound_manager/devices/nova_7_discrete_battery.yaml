device:
  name: SteelSeries Arctis Nova 7 (Gen 1)
  vendor_id: 0x1038
  product_ids:
    - 0x2202 # Arctis Nova 7
    - 0x2206 # Arctis Nova 7X
    - 0x223a # Arctis Nova 7 Diablo IV Edition
    - 0x227a # Arctis Nova 7 WoW Edition
    - 0x22a4 # Arctis Nova 7X (variant)
  command_padding:
    length: 64
    position: end
    filler: 0x00

  command_transport: ctrl_output  # HID SET_REPORT (no interrupt OUT endpoint)
  command_interface_index: [3, 0]
  listen_interface_indexes: [3]
  dial_interface_index: 3         # expected dial interface
  dial_interface_candidates: [5]  # WoW Edition (0x227a) may use interface 5 (bInterfaceNumber)

  device_init:
    - [0x10]
    - ['status.request']
    - [0xa3, 'settings.pm_shutdown']
    - [0xb2, 0x00]
    - [0x3a, 'settings.volume_limiter']
    - [0xae, 'settings.mic_mute_led_brightness']
    - [0x37, 'settings.mic_volume']
    - [0xb3, 'settings.bluetooth_auto_mute']
    - [0x39, 'settings.mic_side_tone']
    - [0x09]
    - ['status.request']
    - [0x09]

  status:
    request: 0xb0
    response_mapping:
      - starts_with: 0x45
        media_mix: 0x01
        chat_mix: 0x02

      # base_arctis_nova_7_tx.device, `(struct headset_status)` (incoming):
      # report_id, command, connection_status, battery_status, charging_status,
      # game_chatmix_level, chat_chatmix_level — seven fields, none of them
      # padding, ending at ASM offset 0x05 (spec field index minus one, since
      # these buffers carry no report id). There is no field 6, 7, 8 or 9 —
      # not even declared unused. bluetooth_connection / bluetooth_power_status
      # / bluetooth_auto_mute / mic_status used to be read from those
      # nonexistent offsets and always returned a plausible-looking value from
      # whatever the buffer happened to hold (zero-filled in practice). This
      # family's `bluetooth_startup` (0xB2) and `bt_call_default` (0xB3) are
      # api-write-only in the same spec, so there is nothing to read back —
      # the corresponding settings below stay write-only, with no live status.
      - starts_with: 0xb0
        headset_power_status: 0x01
        headset_battery_charge: 0x02
        cable_charging: 0x03
        media_mix: 0x04
        chat_mix: 0x05

    representation:
      headset:
        - headset_power_status
        - headset_battery_charge
        - chat_mix
        - media_mix
        - cable_charging

  # On-device 10-band EQ (eq, opcode 0x33): one gain byte per band. GG derives
  # it as 2 * (10 + gain_dB), which is exactly ASM's 0-40 slider scale.
  hardware_eq:
    command: [0x33]

  online_status:
    status_variable: headset_power_status
    online_value: online

  audio:
    spatial_engine: hesuvi

  settings:
    headset:
      volume_limiter:
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00
        update_sequence: [0x3a, 'value']
      bluetooth_auto_mute:
        type: button_group
        values_mapping:
          0x00: none
          0x01: -12_db
          0x02: mute
        default: 0x00
        update_sequence: [0xb3, 'value']
      bluetooth_power_status:
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00
        update_sequence: [0xb2, 'value']
    microphone:
      mic_volume:
        type: slider
        min: 0x00
        max: 0x07
        step: 1
        min_label: mic_muted
        max_label: perc_100
        default: 0x07
        update_sequence: [0x37, 'value']
      mic_side_tone:
        type: button_group
        values_mapping:
          0x00: off
          0x01: low
          0x02: medium
          0x03: high
        default: 0x00
        update_sequence: [0x39, 'value']
      mic_mute_led_brightness:
        type: button_group
        values_mapping:
          0x00: off
          0x01: low
          0x02: medium
          0x03: high
        default: 0x03
        update_sequence: [0xae, 'value']
    power_management:
      pm_shutdown:
        type: button_group
        values_mapping:
          0x00: never
          0x01: 1_minute
          0x05: 5_minutes
          0x0a: 10_minutes
          0x0f: 15_minutes
          0x1e: 30_minutes
          0x2d: 45_minutes
          0x3c: 60_minutes
          0x4b: 75_minutes
          0x5a: 90_minutes
        default: 0x1e
        update_sequence: [0xa3, 'value']

  status_parse:
    headset_power_status:
      type: on_off
      off: 0x02
      on: 0x03
    headset_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 4
    cable_charging:
      # SteelSeries' own translate_charging_status, identical across every
      # Arctis family: 0 unknown / 1 charging / 2 plugged in but not charging
      # / 3 on battery. 0x00 and 0x02 used to be unmapped, so the indicator
      # simply vanished once the headset finished charging on the cable.
      type: int_str_mapping
      values:
        0x00: unknown
        0x01: on
        0x02: plugged_not_charging
        0x03: off
    media_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    chat_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
