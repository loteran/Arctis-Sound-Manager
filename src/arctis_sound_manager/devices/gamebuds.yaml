device:
  name: SteelSeries Arctis GameBuds
  # GG's own minimum spacing between commands for this firmware family.
  time_between_commands_ms: 50
  # GG's own wait after the transmitter enumerates before sending it any
  # command at all (init-sleep-length; standard-boilerplate default).
  init_sleep_length_ms: 100
  # GG's own retry delay after the earbuds reconnect their radio link (up to
  # 10 attempts) before it trusts the settings it reads back — here it's the
  # full settings sync that gets retried, not just a firmware-version read,
  # but the same "don't trust the first read" principle applies to ASM's
  # own settings replay just as much.
  radio_reconnect_probe_delay_ms: 500
  vendor_id: 0x1038
  product_ids:
    - 0x230a  # Arctis GameBuds (PS5/PC) via dongle 2.4 GHz — confirmé par capture USB
    - 0x2317  # Arctis GameBuds X (Xbox) via dongle 2.4 GHz — PID vu en télémétrie, protocole supposé identique
  command_padding:
    length: 64
    position: end
    filler: 0x00

  command_transport: ctrl_output  # HID SET_REPORT (wIndex=3, interface vendor 0xffc0)
  # The HID usage page the *command* interface declares, which the line above
  # has recorded since this profile was written. 1.4.10 replaced it with
  # 0xff00, taken from the spec's `(sync-interface ...)` - a different
  # declaration, naming the interface that pushes events rather than the one
  # commands go to. The page then matched nothing on the device, which is what
  # sent the resolver guessing and cost this headset its status (#216, #217).
  hid_usage_page: 0xffc0
  command_interface_index: [3, 0]
  listen_interface_indexes: [3]

  # The charging case (base_arctis_gamebuds_case.device): a separate USB
  # product, seen only while the case is plugged into this computer. It has
  # no audio, so it must never become the device ASM drives — it is not in
  # product_ids, and charging_case.ChargingCaseMonitor reads it on the side
  # (0xB7 batteries + charging, 0xB8 buds seated, 0xBC lid). Same transport
  # as the dongle above (64-byte SET_REPORT, page 0xffc0), per the spec's
  # `(api-read HID (chunk HIDIO 65 ...))` shared by both files. The
  # interface number is not in any specification: 3 is the dongle's, used
  # only when sysfs does not show exactly one interface on page 0xffc0
  # (the case's push interface declares 0xffc1, its sync-interface).
  charging_case:
    product_ids:
      - 0x230c  # Arctis GameBuds Case
      - 0x231a  # Arctis GameBuds X Case
    hid_usage_page: 0xffc0
    command_interface_index: 3

  # Status protocol (issue #202): `(struct headset_settings)` in
  # base_arctis_gamebuds_dongle.device, command 0xB0. Neither
  # arctis_gamebuds_dongle.device (0x230a) nor arctis_gamebuds_x_dongle.device
  # (0x2317, this reporter's model) overrides that struct — both merely
  # `(include "base_arctis_gamebuds_dongle")` and redefine product ids /
  # firmware-version strings, so the base layout applies to every PID below.
  #
  # Offsets are the spec's field position minus two: `report_id` is not in
  # ASM's buffers, and by GG's own convention the `command` echo occupies ASM
  # offset 0x00 (checked against a second family: base_arctis_nova_7_gen2_tx
  # .device numbers `connection_status` as its 3rd incoming field —
  # report_id, command, connection_status — and nova_7_perc_battery.yaml
  # reads it at 0x01, i.e. field position 3 minus 2). Applied here:
  #
  #   field                        spec pos   ASM offset
  #   report_id                    1          (absent)
  #   command (0xB0 echo)          2          0x00 (== starts_with)
  #   bt_left_connect_status       3          0x01
  #   bt_right_connect_status      4          0x02
  #   left_connect_status          5          0x03
  #   right_connect_status         6          0x04
  #   left_battery_level           7          0x05
  #   right_battery_level          8          0x06
  #   transparency_level           9          0x07  (not mapped, see below)
  #   anc_level                    10         0x08  (not mapped)
  #   transparency_anc_mode        11         0x09  (not mapped)
  #   mute_led_brightness          12         0x0a  (not mapped)
  #   inactivity_timer             13         0x0b  (not mapped)
  #   wear_sense_config            14         0x0c  (not mapped)
  #   wear_sense_status            15         0x0d  (not mapped)
  #   button_maps (6 maps + 2)     16-35      0x0e-0x21 (not mapped)
  #
  # Confirmed independently: the struct's own `api-on-read-success` checks
  # `(extract-bytes payload 15 6)` for the button-map zero-guard, where
  # `payload` is 0-indexed and DOES include report_id — byte 15 there is
  # ASM offset 0x0e, exactly where button_maps starts above.
  #
  # Only left/right connect-status and left/right battery are mapped: they
  # are what issue #202 needs, and everything from transparency_level on is
  # a *setting* (ANC/transparency level, LED brightness, wear-sense, button
  # mapping…), not a status reading — mapping it here without a settings UI
  # for it would be dead data. bt_left/right_connect_status ARE mapped
  # because they're free (same frame, adjacent bytes) but are not used by
  # any status_parse/representation/online_status below: the struct's
  # documented 4-state comment (NOT PAIRED.../PAIRED CONNECTED) sits between
  # bt_right_connect_status and left_connect_status, and SteelSeries' own
  # get-wireless-device-connection-status() and connection_status_summary()
  # both consume left/right_connect_status exclusively, never the bt_ pair —
  # so only the former are wired into ASM's status.
  #
  # Two batteries, one reading: the tray shows a single percentage, so
  # headset_battery_charge is the MIN of the two buds — the one that dies
  # first ends a stereo session, so it is the number worth warning on rather
  # than an average that hides it.
  #
  # Two connect-status bytes, one online flag: SteelSeries' own firmware
  # (get-wireless-device-connection-status) computes exactly
  # `(left_connect_status == 3) or (right_connect_status == 3)` — "either
  # earbud paired and connected" counts as online. ASM's online_status is a
  # single status_variable/online_value pair (see OnlineStatusConfig), so
  # that OR is folded into one derived field here via a `max` combinator
  # (3 is the top of the 0-3 range, so max == logical OR on "== 3"), then run
  # through the same on_off parser every other Arctis family uses for its
  # single connection_status byte. Picking either side alone would go
  # offline whenever the user wears just the other bud — precisely the "ASM
  # thinks a working headset is offline" failure this task warns against.
  #
  # The case is NOT in product_ids: see charging_case above.
  #
  # Still unidentified, unrelated to status: 0xb8 (seen taking 3 values —
  # 0x01/0x02/0x03 — in USB capture; ANC force mode or BT auto-mute is a
  # guess, not confirmed against the spec). Reverse-engineered originally via
  # HeadsetControl issue #388 (January 2025), before the vendor spec used
  # above was available.
  status:
    request: 0xb0
    response_mapping:
      - starts_with: 0xb0
        bt_left_connect_status: 0x01
        bt_right_connect_status: 0x02
        left_connect_status: 0x03
        right_connect_status: 0x04
        left_battery_level: 0x05
        right_battery_level: 0x06
        headset_power_status:
          max: [0x03, 0x04]
        headset_battery_charge:
          min: [0x05, 0x06]

    representation:
      headset:
        - headset_power_status
        - headset_battery_charge

  status_parse:
    headset_power_status:
      type: on_off
      off: 0x02
      on: 0x03
    headset_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 100

  online_status:
    status_variable: headset_power_status
    online_value: online

  device_init:
    - [0x37, 'settings.mic_volume']
    - [0x39, 'settings.mic_side_tone']
    - [0xbd, 'settings.noise_cancelling']
    - [0xb9, 'settings.noise_level']
    - [0xc1, 'settings.pm_shutdown']
    - [0x27, 'settings.volume_limiter']
    - [0xc5, 'settings.wear_sense']
    - [0xb8, 'settings.anc_level']
    - [0x25, 'settings.volume_24g']
    - [0x23, 'settings.volume_bt']
    - [0x09]
    - ['status.request']

  # On-device parametric EQ (parametric_eq, opcode 0x19). Same shape as the
  # Nova 5: no connection byte in the band frame, no commit frame, and a
  # 600 ms pause between the two writes.
  hardware_eq:
    format: parametric
    name_command: 0x19
    band_command: 0x33
    bands_carry_connection: false
    frame_delay_ms: 600

  audio:
    spatial_engine: hesuvi

  # Read-only queries for `asm-cli tools probe` (generated from the
  # spec by gg_draft.py): their raw replies check a spec layout
  # on real hardware in one pass. Constants only — nothing is set.
  probe_queries:
    - name: headset_settings
      frame: [0xb0]
      fields: {bt_left_connect_status: 1, bt_right_connect_status: 2, left_connect_status: 3, right_connect_status: 4, left_battery_level: 5, right_battery_level: 6, transparency_level: 7, anc_level: 8, transparency_anc_mode: 9, mute_led_brightness: 10, inactivity_timer: 11, wear_sense_config: 12, wear_sense_status: 13, right_1_tap: [14, 3], right_2_tap: [17, 3], right_3_tap: [20, 3], left_1_tap: [23, 3], left_2_tap: [26, 3], left_3_tap: [29, 3], right_med_hold: [32, 3], left_med_hold: [35, 3], right_hold: 38, left_hold: 39, audio_mode: 40, eq_sync: 41, left_spin_color: 42, right_spin_color: 43, dongle_spin_color: 44}
    - name: audio_settings
      frame: [0x20]
      reply: feature
      size: 515
      report_id: 0x00
      fields: {eq_band_1: [1, 6], eq_band_2: [7, 6], eq_band_3: [13, 6], eq_band_4: [19, 6], eq_band_5: [25, 6], eq_band_6: [31, 6], eq_band_7: [37, 6], eq_band_8: [43, 6], eq_band_9: [49, 6], eq_band_10: [55, 6], eq_band_bt_1: [61, 6], eq_band_bt_2: [67, 6], eq_band_bt_3: [73, 6], eq_band_bt_4: [79, 6], eq_band_bt_5: [85, 6], eq_band_bt_6: [91, 6], eq_band_bt_7: [97, 6], eq_band_bt_8: [103, 6], eq_band_bt_9: [109, 6], eq_band_bt_10: [115, 6], mic_volume: 121, sidetone: 122, volume_limiter: 123, onboard_effect_status: 124, mic_mute: 125}
    - name: get_volume_24g
      frame: [0x24]
      fields: {level: 1}
    - name: get_volume_bt
      frame: [0x22]
      fields: {level: 1}


  # Current button table, from the same 0xb0 reply as the status. Offsets are
  # the rf_map byte of each gesture, then its call map, then the two hold flags.
  # A table whose first six bytes are all zero is not trusted (earbuds not
  # connected or in the case): adopting it would unassign every gesture on the
  # next write. silent: the eighteen values are one command, so adopting them
  # must not send it.
  settings_readback:
    - request: 0xb0
      starts_with: 0xb0
      skip_if_all_zero: [0x0e, 0x13]
      silent: true
      mapping:
        right_1_tap: 0x0e
        right_1_tap_call: 0x10
        right_2_tap: 0x11
        right_2_tap_call: 0x13
        right_3_tap: 0x14
        right_3_tap_call: 0x16
        left_1_tap: 0x17
        left_1_tap_call: 0x19
        left_2_tap: 0x1a
        left_2_tap_call: 0x1c
        left_3_tap: 0x1d
        left_3_tap_call: 0x1f
        right_med_hold: 0x20
        right_med_hold_call: 0x22
        left_med_hold: 0x23
        left_med_hold_call: 0x25
        right_hold: 0x26
        left_hold: 0x27

  settings:
    microphone:
      mic_volume:
        type: slider
        min: 0x00
        max: 0x0a
        step: 1
        min_label: mic_muted
        max_label: perc_100
        default: 0x0a
        update_sequence: [0x37, 'value']
      mic_side_tone:
        # Wire values are 0 / 3 / 6 / 10, NOT 0-3: GG's UI works on a 0-3 scale
        # and transform_sidetone_ui_to_fw maps it to these before sending. The
        # struct's `range 0 3` is GG's API scale — do not "fix" this to 0-3.
        type: button_group
        values_mapping:
          0x00: off
          0x03: low
          0x06: medium
          0x0a: high
        default: 0x00
        update_sequence: [0x39, 'value']
    audio:
      audio_source:
        # audio_mode (0xAA): which link the earbuds play, 0 the 2.4 GHz
        # dongle, 1 Bluetooth. GG has no control of its own for it: switching
        # its EQ panel between the Wireless and Bluetooth tabs sends this
        # (the Quick Switch a button can also be mapped to). On Bluetooth,
        # this computer's audio through the dongle stops reaching the
        # earbuds. Not yet tried on real GameBuds.
        type: button_group
        default: 0x00
        update_sequence: [0xaa, 'value']
        values_mapping:
          0x00: audio_source_dongle
          0x01: audio_source_bluetooth
      noise_cancelling:
        type: button_group
        values_mapping:
          0x00: off
          0x01: transparent
          0x02: on
        default: 0x00
        update_sequence: [0xbd, 'value']
      noise_level:
        # This is specifically the *transparency* level (opcode 0xb9) — ANC
        # has its own separate level memory on the device (opcode 0xb8, see
        # anc_level below); the two are independent, not one shared slider.
        # GG exposes three steps and transform_transparency_ui_to_fw sends
        # 3 / 6 / 10 for them; its inverse buckets anything 7-10 back to "high",
        # so the firmware takes a continuous 0-10 level. Kept as a fine-grained
        # slider — the `range 1 3` in the struct is GG's UI scale, not the wire
        # values, and narrowing this to 1-3 would send levels the device never
        # receives from GG.
        type: slider
        min: 0x00
        max: 0x0a
        step: 1
        min_label: perc_0
        max_label: perc_100
        default: 0x06
        update_sequence: [0xb9, 'value']
      anc_level:
        # ANC's own intensity, independent of the transparency level above
        # (opcode 0xb8, `(field level uint8 (range 1 3))` — a plain 1-3 scale
        # on the wire, no UI/FW transform unlike transparency's 0xb9).
        type: slider
        min: 0x01
        max: 0x03
        step: 1
        min_label: perc_0
        max_label: perc_100
        default: 0x02
        update_sequence: [0xb8, 'value']
      volume_24g:
        # Playback volume over the 2.4GHz dongle link — independent from
        # volume_bt below, the earbuds keep separate memories per connection
        # (opcode 0x25 write / 0x24 read, level 0-15). GG adds a 200ms
        # device-side settle (a HIDSLEEP report) before this write because
        # the device can't handle the volume sliding too fast; ASM has no
        # equivalent of a device-side sleep report, so this instead relies
        # on the family's own time_between_commands_ms (50ms) pacing above —
        # a smaller margin, not the exact same mechanism.
        type: slider
        min: 0x00
        max: 0x0f
        step: 1
        min_label: perc_0
        max_label: perc_100
        default: 0x0f
        update_sequence: [0x25, 'value']
      volume_bt:
        # Playback volume over Bluetooth — see volume_24g above, same shape,
        # independent memory (opcode 0x23 write / 0x22 read).
        type: slider
        min: 0x00
        max: 0x0f
        step: 1
        min_label: perc_0
        max_label: perc_100
        default: 0x0f
        update_sequence: [0x23, 'value']
    headset:
      volume_limiter:
        # Fix: was update_sequence [0xc5, 'value'] — 0xc5 is wear_sense in
        # SteelSeries' own spec (base_arctis_gamebuds_dongle.device), not
        # volume_limiter (0x27). This toggle was silently controlling
        # wear-sense instead of the volume limiter it's labelled as; the
        # opcode below is the corrected one — see device_init above too.
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00
        update_sequence: [0x27, 'value']
      wear_sense:
        # Fix: was update_sequence [0x27, 'value'] — swapped with
        # volume_limiter above, see that comment.
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x01
        update_sequence: [0xc5, 'value']
    power_management:
      pm_shutdown:
        type: button_group
        values_mapping:
          0x00: never
          0x01: 1_minute
          0x05: 5_minutes
          0x0a: 10_minutes
          0x0f: 15_minutes
          0x1e: 30_minutes
          0x2d: 45_minutes
          0x3c: 60_minutes
          0x4b: 75_minutes
          0x5a: 90_minutes
        default: 0x1e
        update_sequence: [0xc1, 'value']

    # Touch gestures (GG exposes four of the eight, and so does ASM). One 0xc9 frame carries the
    # whole table: per gesture the action on the 2.4 GHz dongle, on Bluetooth
    # and during a call, then the two hold flags. GG writes the same action to
    # dongle and Bluetooth and never changes the call actions or the flags, so
    # each gesture below is one choice written twice, and the call actions and
    # flags are hidden values that follow what the earbuds report (see
    # settings_readback). Values are HID consumer usages. The section makes the
    # Headset page show a "Buttons" card, only for profiles that declare it.
    buttons:
      right_1_tap:
        type: button_group
        values_mapping:
          0xcd: btn_play_pause
          0xe9: btn_volume_up
          0xea: btn_volume_down
          0xb5: btn_next_track
          0xb6: btn_previous_track
          0x51: btn_voice_assistant
          0x49: btn_noise_control
          0xe2: btn_mic_mute
          0x53: btn_quick_switch
          0x00: btn_unassigned
        default: 0xcd
        update_sequence: &buttons_frame
          - 0xc9
          - 'settings.right_1_tap'
          - 'settings.right_1_tap'
          - 'settings.right_1_tap_call'
          - 'settings.right_2_tap'
          - 'settings.right_2_tap'
          - 'settings.right_2_tap_call'
          - 'settings.right_3_tap'
          - 'settings.right_3_tap'
          - 'settings.right_3_tap_call'
          - 'settings.left_1_tap'
          - 'settings.left_1_tap'
          - 'settings.left_1_tap_call'
          - 'settings.left_2_tap'
          - 'settings.left_2_tap'
          - 'settings.left_2_tap_call'
          - 'settings.left_3_tap'
          - 'settings.left_3_tap'
          - 'settings.left_3_tap_call'
          - 'settings.right_med_hold'
          - 'settings.right_med_hold'
          - 'settings.right_med_hold_call'
          - 'settings.left_med_hold'
          - 'settings.left_med_hold'
          - 'settings.left_med_hold_call'
          - 'settings.right_hold'
          - 'settings.left_hold'
      right_2_tap:
        type: button_group
        values_mapping:
          0xcd: btn_play_pause
          0xe9: btn_volume_up
          0xea: btn_volume_down
          0xb5: btn_next_track
          0xb6: btn_previous_track
          0x51: btn_voice_assistant
          0x49: btn_noise_control
          0xe2: btn_mic_mute
          0x53: btn_quick_switch
          0x00: btn_unassigned
        default: 0xb5
        update_sequence: *buttons_frame
      right_3_tap:
        # Not offered by GG. Assigning it broke the firmware's own action
        # for this gesture until a reset in GG (#337), so it is only
        # written back as the earbuds report it.
        type: slider
        hidden: true
        min: 0x00
        max: 0xff
        step: 1
        default: 0x00
      left_1_tap:
        type: button_group
        values_mapping:
          0xcd: btn_play_pause
          0xe9: btn_volume_up
          0xea: btn_volume_down
          0xb5: btn_next_track
          0xb6: btn_previous_track
          0x51: btn_voice_assistant
          0x49: btn_noise_control
          0xe2: btn_mic_mute
          0x53: btn_quick_switch
          0x00: btn_unassigned
        default: 0x49
        update_sequence: *buttons_frame
      left_2_tap:
        type: button_group
        values_mapping:
          0xcd: btn_play_pause
          0xe9: btn_volume_up
          0xea: btn_volume_down
          0xb5: btn_next_track
          0xb6: btn_previous_track
          0x51: btn_voice_assistant
          0x49: btn_noise_control
          0xe2: btn_mic_mute
          0x53: btn_quick_switch
          0x00: btn_unassigned
        default: 0xb6
        update_sequence: *buttons_frame
      left_3_tap:
        # Not offered by GG. Assigning it broke the firmware's own action
        # for this gesture until a reset in GG (#337), so it is only
        # written back as the earbuds report it.
        type: slider
        hidden: true
        min: 0x00
        max: 0xff
        step: 1
        default: 0x00
      right_med_hold:
        # Not offered by GG. Assigning it broke the firmware's own action
        # for this gesture until a reset in GG (#337), so it is only
        # written back as the earbuds report it.
        type: slider
        hidden: true
        min: 0x00
        max: 0xff
        step: 1
        default: 0x00
      left_med_hold:
        # Not offered by GG. Assigning it broke the firmware's own action
        # for this gesture until a reset in GG (#337), so it is only
        # written back as the earbuds report it.
        type: slider
        hidden: true
        min: 0x00
        max: 0xff
        step: 1
        default: 0x00
      right_1_tap_call:
        # Kept only to be written back inside the frame; follows the earbuds.
        type: slider
        hidden: true
        min: 0x00
        max: 0xff
        step: 1
        default: 0x50
      right_2_tap_call:
        # Kept only to be written back inside the frame; follows the earbuds.
        type: slider
        hidden: true
        min: 0x00
        max: 0xff
        step: 1
        default: 0x52
      right_3_tap_call:
        # Kept only to be written back inside the frame; follows the earbuds.
        type: slider
        hidden: true
        min: 0x00
        max: 0xff
        step: 1
        default: 0x00
      left_1_tap_call:
        # Kept only to be written back inside the frame; follows the earbuds.
        type: slider
        hidden: true
        min: 0x00
        max: 0xff
        step: 1
        default: 0x50
      left_2_tap_call:
        # Kept only to be written back inside the frame; follows the earbuds.
        type: slider
        hidden: true
        min: 0x00
        max: 0xff
        step: 1
        default: 0x52
      left_3_tap_call:
        # Kept only to be written back inside the frame; follows the earbuds.
        type: slider
        hidden: true
        min: 0x00
        max: 0xff
        step: 1
        default: 0x00
      right_med_hold_call:
        # Kept only to be written back inside the frame; follows the earbuds.
        type: slider
        hidden: true
        min: 0x00
        max: 0xff
        step: 1
        default: 0x00
      left_med_hold_call:
        # Kept only to be written back inside the frame; follows the earbuds.
        type: slider
        hidden: true
        min: 0x00
        max: 0xff
        step: 1
        default: 0x00
      right_hold:
        # Kept only to be written back inside the frame; follows the earbuds.
        type: slider
        hidden: true
        min: 0x00
        max: 0xff
        step: 1
        default: 0x00
      left_hold:
        # Kept only to be written back inside the frame; follows the earbuds.
        type: slider
        hidden: true
        min: 0x00
        max: 0xff
        step: 1
        default: 0x00
