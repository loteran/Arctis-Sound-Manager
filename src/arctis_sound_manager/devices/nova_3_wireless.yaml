# ── Arctis Nova 3P / 3X Wireless (0x2269 / 0x226d) ────────────────────────────
#
# These dongles used to share a profile with the WIRED Nova 3 (0x12ec) and were
# driven as if they were one: report id 0x06 over control-feature transfers on
# interface 4, and no status polling at all because "the connection is always-on
# via USB" — true of the wired model, not of a dongle with a headset at the
# other end of a radio link.
#
# Rewritten from SteelSeries' own specification (base_arctis_nova_3_wireless_tx)
# with the USB layout confirmed on real hardware by @rhavinx in #149: interface
# 3 carries the 64-byte interrupt endpoint, interface 4 is a 4-byte consumer
# endpoint and interface 5 a second 64-byte one. Commands take report id 0x00,
# like every other recent Arctis dongle.
#
# Gains over the old shared profile: battery level, powered on/off detection and
# the routing that follows from it, ChatMix, a 10-step sidetone instead of 4,
# plus the volume limiter, sleep timer and range/quality switch. The mic LED
# brightness is gone — this dongle has no such command, ASM was writing into
# the void.
# ──────────────────────────────────────────────────────────────────────────────
device:
  name: SteelSeries Arctis Nova 3 Wireless
  vendor_id: 0x1038
  product_ids:
    - 0x2269 # Arctis Nova 3P Wireless
    - 0x226d # Arctis Nova 3X Wireless
  command_padding:
    length: 64
    position: end
    filler: 0x00

  command_transport: ctrl_output  # HID SET_REPORT, report id 0x00

  # No hid_usage_page here on purpose. The value that used to be here came from
  # the spec's `(sync-interface ...)`, which is a different declaration from
  # `(usage-page ...)`: the first names the interface that pushes events, the
  # second the interface commands go to. SteelSeries' own engine treats them as
  # two primitives taking different arguments. Naming the sync interface's page
  # as the command interface's is what shipped 1.4.10 (#216, #217). Absent is
  # honest here; a wrong page would be used to choose between vendor interfaces.

  command_interface_index: [3, 0]
  # Listen on BOTH 3 and 5. @rhavinx's usbhid-dump on real hardware (#149)
  # showed the async push frames (0x52 mic mute, 0xB7 battery, 0xB9 connection,
  # 0xBB charging) all arrive on interface 5 — only the polled 0xB0 reply lands
  # on interface 3. With interface 3 alone the mic-mute state never surfaced
  # (0x52 was never heard); battery/charging still worked because they are also
  # read from the polled 0xB0. Adding interface 5 lets the mute event through
  # and makes battery/connection/charging update live instead of poll-only.
  listen_interface_indexes: [3, 5]

  device_init:
    - ['status.request']
    # ChatMix on this dongle is software-based and starts disabled (#149):
    # `(struct software_chatmix_status)` in the spec (command 0x49, status
    # 0/1) gates it, and `base_supported_features` lists
    # MM_DEVICE_FEATURE_SOFTWARE_CHATMIX_INFINITE. With it left at its
    # power-on default, @rhavinx's capture showed turning the dial produces
    # zero USB traffic on every interface — it behaves as a plain local
    # volume knob and ASM has nothing to read. `(enable-chatmix)` in the spec
    # writes exactly [0x49, 0x01]; this is that write. It is a mode switch,
    # not a user-adjustable setting, so replaying it at every init does not
    # fall under the "never replay a user setting" rule.
    - [0x49, 0x01]
    - [0xa3, 'settings.pm_shutdown']
    - [0x37, 'settings.mic_volume']
    - [0x39, 'settings.mic_side_tone']
    - [0x27, 'settings.volume_limiter']
    - [0x35, 'settings.range_extend']
    # Ask for the microphone state instead of waiting for someone to press
    # mute. 0x52 is a read command as well as a push: `(struct mic_status)`
    # declares an outgoing [report_id, 0x52] whose reply carries jack presence
    # then mute state — the same layout as the push, so the 0x52 mapping below
    # parses both. Without this the Microphone section is simply absent from
    # the Devices page until the first mute press: the daemon starts with no
    # status values at all, the polled 0xB0 on this dongle carries nothing
    # about the mic, and get_status() drops a category with no populated
    # variable (#149, reported by @rhavinx on v1.2.17).
    - [0x52]
    - ['status.request']

  status:
    request: 0xb0
    response_mapping:
      # ── Push events. This dongle leans on them heavily; the spec even notes
      # that the connection event is "crucial for Nova 3 wireless devices to
      # ensure accurate data retrieval". Unlike the Nova 7 family these are not
      # prefixed 0x07 — the opcode itself leads the frame.
      # Byte offsets corrected from @rhavinx's usbhid-dump capture on real
      # hardware (#149): the spec-derived guess (media_mix 0x02 / chat_mix 0x03)
      # was one byte too far — the opcode leads the frame with no extra header,
      # so the two mix levels sit at 0x01 / 0x02. Same off-by-one class as the
      # battery byte, only on the push frame instead of 0xb0.
      #
      # This frame was never actually observed in @rhavinx's capture — ChatMix
      # was disabled at the time (device_init did not yet send [0x49, 0x01]),
      # so the dial produced no traffic at all on any interface. The spec's
      # own `software_chatmix_status`/`enable-chatmix` machinery doesn't
      # define an async push for the dial either; the documented read path is
      # polling `headset_status` (0xB0), handled below. Kept here in case the
      # firmware does push 0x45 once ChatMix is enabled — harmless no-op if it
      # never arrives, and 0xB0 is the mapping actually relied upon.
      - starts_with: 0x45        # ChatMix dial moved (unconfirmed on this device)
        media_mix: 0x01
        chat_mix: 0x02

      # Capture shows only byte 0x02 toggles 0x00/0x01 on each mute press (#149);
      # the spec-derived 0x03 read a neighbouring byte that never changed.
      - starts_with: 0x52        # mic jack + mute state
        mic_status: 0x02

      - starts_with: 0xb7        # battery level
        headset_battery_charge: 0x02

      - starts_with: 0xb9        # connection state
        headset_power_status: 0x02

      - starts_with: 0xbb        # charging state
        cable_charging: 0x02

      # ── Polled status (0xB0). Byte 0x02 is declared unused by the spec and
      # is deliberately not read: a variable pointing at padding shows
      # plausible noise rather than nothing — reading the battery there is
      # exactly why a hand-written profile had it pinned at 100 % (#149).
      #
      # media_mix / chat_mix (spec fields chatmix_game / chatmix_chat) sit at
      # 0x05 / 0x06 here — the spec's headset_status struct has chatmix_game=6
      # and chatmix_chat=7 counting from report_id, and every field this
      # profile shares with the spec is off by exactly -1 from its spec offset
      # (connection_status 2→0x01, battery_status 4→0x03, charging_status
      # 5→0x04, all three confirmed by @rhavinx's capture).
      #
      # They are still NOT read, on purpose. e830e66 removed them because
      # polling those bytes pinned Sonar's Game channel to ~3 % on init: with
      # ChatMix disabled they carry no mix level, just whatever the firmware
      # leaves there. Enabling the mode above should make them live — but an
      # out-of-range write is swallowed by the headset without a word, so we
      # have no evidence yet that 0x49 took. Reading them back before that is
      # confirmed on hardware would restore the volume bug for every owner of
      # this headset. They go back in once @rhavinx reports the dial working.
      - starts_with: 0xb0
        headset_power_status: 0x01
        headset_battery_charge: 0x03
        cable_charging: 0x04

    representation:
      headset:
        - headset_power_status
        - headset_battery_charge
        - cable_charging
      mic:
        - mic_status

  online_status:
    status_variable: headset_power_status
    online_value: on

  audio:
    spatial_engine: hesuvi

  # On-device parametric EQ, same shape as the Nova 5: name opcode 0xA5, no
  # commit frame, and a 600 ms pause before the bands.
  hardware_eq:
    format: parametric
    name_command: 0xa5
    band_command: 0x33
    bands_carry_connection: false
    frame_delay_ms: 600

  settings:
    headset:
      volume_limiter:
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00
        update_sequence: [0x27, 'value']
    microphone:
      mic_volume:
        # 0-15 on this family, not the 0-10 the wired profile declared.
        type: slider
        min: 0x00
        max: 0x0f
        step: 1
        min_label: mic_muted
        max_label: perc_100
        default: 0x0f
        update_sequence: [0x37, 'value']
      mic_side_tone:
        # Ten steps, where the shared wired profile offered four.
        type: slider
        min: 0x00
        max: 0x0a
        step: 1
        min_label: off
        max_label: perc_100
        default: 0x00
        update_sequence: [0x39, 'value']
    wireless:
      range_extend:
        # Trades sample rate for radio range.
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: speed
          on_label: range
        default: 0x00
        update_sequence: [0x35, 'value']
    power_management:
      pm_shutdown:
        type: button_group
        values_mapping:
          0x00: never
          0x01: 1_minute
          0x05: 5_minutes
          0x0a: 10_minutes
          0x0f: 15_minutes
          0x1e: 30_minutes
          0x2d: 45_minutes
          0x3c: 60_minutes
        default: 0x1e
        update_sequence: [0xa3, 'value']

  status_parse:
    # connection_status: 0 not paired / 1 searching / 2 paired-not-connected /
    # 3 paired-connected. Only 3 means the headset is reachable.
    headset_power_status:
      type: on_off
      off: 0x02
      on: 0x03
    headset_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 100
    cable_charging:
      type: int_str_mapping
      values:
        0x00: unknown
        0x01: on
        0x02: plugged_not_charging
        0x03: off
    media_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    chat_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    # Spec: [0] mute off, [1] mute on, [255] unknown.
    mic_status:
      type: int_str_mapping
      values:
        0x00: unmuted
        0x01: muted
        # The spec gives 255 as a third state for both mic fields, and it is
        # what the readback answers before the headset knows. Left unmapped it
        # parses to nothing, which takes the whole Microphone section down with
        # it — the state is unknown, so say so rather than show an empty page.
        0xff: unknown
