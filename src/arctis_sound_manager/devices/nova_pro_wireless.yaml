device:
  name: SteelSeries Arctis Nova Pro Wireless
  # GG's own minimum spacing between commands for this firmware family.
  # This profile's device_init sends the same Sonar/ChatMix mode-switch
  # pair (0x8d, 0x49) as the Nova Pro Omni without an explicit settle —
  # PR #245 flagged this family as untested but likely affected by the
  # same abandoned-mode-switch bug; this generic pacing covers it.
  time_between_commands_ms: 50
  # GG's own wait after the transmitter enumerates before sending it any
  # command at all (init-sleep-length) — the firmware itself is still
  # booting for this long.
  init_sleep_length_ms: 5000
  # GG's own retry delay for a status read after the wireless headset
  # reconnects its radio link (up to 10 attempts) instead of trusting a
  # single flat settle time before replaying settings.
  radio_reconnect_probe_delay_ms: 100
  vendor_id: 0x1038
  product_ids:
    - 0x12e0 # SteelSeries Arctis Nova Pro Wireless
    - 0x12e5 # SteelSeries Arctis Nova Pro Wireless X
    - 0x225d # SteelSeries Arctis Nova Pro Wireless X (3rd variant, added upstream v2.4.1)
    # 0x2290 (Nova Pro Omni) moved to its own profile (nova_pro_omni.yaml) — its
    # USB control interface/transport needs confirmation; see that file.
  command_padding:
    length: 64
    position: end
    filler: 0x00

  # No hid_usage_page here on purpose. The value that used to be here came from
  # the spec's `(sync-interface ...)`, which is a different declaration from
  # `(usage-page ...)`: the first names the interface that pushes events, the
  # second the interface commands go to. SteelSeries' own engine treats them as
  # two primitives taking different arguments. Naming the sync interface's page
  # as the command interface's is what shipped 1.4.10 (#216, #217). Absent is
  # honest here; a wrong page would be used to choose between vendor interfaces.

  command_interface_index: [4, 0] # bInterfaceNumber, bAlternateSetting
  listen_interface_indexes: [4] # bInterfaceNumber

  device_init:
    - [0x06, 0x20]
    - [0x06, 0x20]
    - [0x06, 0x10]
    - [0x06, 0x10]
    - [0x06, 0x10]
    - [0x06, 0x3b] # Correction?
    - [0x06, 0x8d, 0x01]
    - [0x06, 0x20]
    - [0x06, 0x20]
    - [0x06, 0x20]
    - [0x06, 0x80]
    - [0x06, 0x3b] # Correction?
    # Burst of commands (device init?)
    - [0x06, 0x8d, 0x01]
    # No custom_eq (0x33) here: it fills the base station's Custom slot, and
    # three gains (the old capture's) left bands 4-10 at 0, i.e. -10 dB,
    # over whatever curve the user had set there in GG or on the DAC. ASM
    # writes all ten bands itself when the EQ mode is Custom.
    - [0x06, 0xc3, 'settings.wireless_mode']      # 2.4G mode (0x00: speed, 0x01: range)
    - [0x06, 0x2e, 0x00]                          # Set equalizer preset (0)
    - [0x06, 0xc1, 'settings.pm_shutdown']        # Set inactive time (to 30 minutes, see INACTIVE_TIME_MINUTES)
    - [0x06, 0xb9, 'settings.transparent_level']
    - [0x06, 0x37, 'settings.mic_volume']         # Mic volume 100% (01 (mute) - a0 (100%))
    - [0x06, 0xb2, 'settings.bluetooth_power_status'] # BT on at power-up
    - [0x06, 0x47, 'settings.line_out_stream_main_left_volume', 'settings.line_out_stream_main_right_volume', 'settings.line_out_stream_aux_volume']
    - [0x06, 0x83, 0x01]
    - [0x06, 0xbd, 'settings.noise_cancelling']
    - [0x06, 0x27, 'settings.gain']               # Audio Gain (0x01: low, 0x02: high)
    - [0x06, 0xb3, 'settings.bluetooth_auto_mute'] # what an incoming call does to game audio
    - [0x06, 0x39, 'settings.mic_side_tone']      # Set the sidetone to 0 (off) -> possible values: 0 (off 1 (low 2 (medium 3 (high)
    - [0x06, 0xbf, 'settings.mic_led_brightness'] # Mute mic led brightness (out of 10)
    - [0x06, 0x43, 'settings.line_out']
    - [0x06, 0x69, 0x00]
    - [0x06, 0x3b, 0x00]
    - [0x06, 0x8d, 0x01]
    - [0x06, 0x49, 0x01]
    - [0x06, 0xb7, 0x00]

    # Another series of queries (perhaps for confirmation?)
    - [0x06, 0xb7, 0x00]
    - [0x06, 0xb7, 0x00]
    - ['status.request']  # Get device status
    - [0x06, 0x20, 0x00]
    - [0x06, 0xb7, 0x00]

  # GG's own (shutdown ...) block for this family: turn sonar/chatmix back
  # off before the interface is released, so the base station falls back to
  # plain hardware volume instead of being left in software-ChatMix mode
  # with nobody driving it once ASM stops.
  shutdown_commands:
    - [0x06, 0x49, 0x00]
    - [0x06, 0x8d, 0x00]

  status:
    request: 0x06b0
    response_mapping:
      - starts_with: 0x0725
        station_volume: 0x02

      # Reply to the [0x06, 0x20] audio_settings query sent at init: the wheel
      # position on the same 0-56 scale as 0x0725, so it is known before the
      # wheel is first turned (#268). Byte 2 is audio_input, not the volume.
      - starts_with: 0x0620
        station_volume: 0x03

      - starts_with: 0x0731
        eq_band_index: 0x02
        eq_band_value: 0x03

      - starts_with: 0x0743
        line_out: 0x02

      - starts_with: 0x0745
        media_mix: 0x02
        chat_mix: 0x03

      - starts_with: 0x0747
        line_out_stream_main_left_volume: 0x02
        line_out_stream_main_right_volume: 0x03
        line_out_stream_aux_volume: 0x04

      - starts_with: 0x07bd
        noise_cancelling: 0x02

      - starts_with: 0x07b9
        transparent_noise_cancelling_level: 0x02

      - starts_with: 0x06b0
        bluetooth_powerup_state: 0x02
        bluetooth_auto_mute: 0x03
        bluetooth_power_status: 0x04
        bluetooth_connection: 0x05
        headset_battery_charge: 0x06
        charge_slot_battery_charge: 0x07
        transparent_noise_cancelling_level: 0x08
        mic_status: 0x09
        noise_cancelling: 0x0a
        mic_led_brightness: 0x0b
        auto_off_time_minutes: 0x0c
        wireless_mode: 0x0d
        wireless_pairing: 0x0e
        headset_power_status: 0x0f
    representation:
      headset:
        - headset_power_status
        - headset_battery_charge
        - noise_cancelling
        - transparent_noise_cancelling_level
        - auto_off_time_minutes
      mic:
        - mic_status
        - mic_led_brightness
      gamedac:
        - station_volume
        - charge_slot_battery_charge
        - line_out
      bluetooth:
        - bluetooth_powerup_state
        - bluetooth_power_status
        - bluetooth_auto_mute
        - bluetooth_connection
      wireless:
        - wireless_mode
        - wireless_pairing
  
  # On-device 10-band EQ (custom_eq): report id 0x06, opcode 0x33, then one
  # byte per band. GG works in dB and converts with 2 * (10 + gain), so the
  # wire values run 0-40 with 20 = 0 dB — which is the scale ASM's sliders
  # already use.
  hardware_eq:
    command: [0x06, 0x33]
    # `custom_eq` (0x33) only fills the Custom slot — the base station draws
    # the curve on its screen, and keeps applying whichever preset is
    # *selected*. `selected_eq_preset` (0x2E) is that choice: [0] Flat
    # [1] Bass Boost [2] Focus [3] Smiley [4] Custom, then the game presets.
    # device_init sets Flat above so the hardware stays neutral behind the
    # Sonar EQ; ASM now switches to Custom whenever it writes a curve, which
    # is what makes these sliders audible instead of merely visible.
    preset_select: [0x06, 0x2e]
    custom_preset_id: 0x04

  online_status:
    status_variable: headset_power_status
    online_value: online

  audio:
    spatial_engine: hesuvi

  # WirePlumber ALSA headroom quirk (issue #105): this device's USB playback
  # SYNC endpoint has no explicit feedback, which causes audible crackle on
  # some systems. Forcing api.alsa.headroom compensates for the missing
  # feedback. 4096 frames ≈ +85 ms of latency — only set this on devices with
  # a confirmed report of the crackle, not by default on every headset.
  alsa_headroom: 4096

  # OLED screen transport parameters — explicit values keep the config
  # self-documenting and let oled_manager.py fall back cleanly for devices
  # that omit this section.
  oled:
    interface: 4       # HID interface carrying the OLED control endpoint
    report_id: 0x06    # First byte of every HID report sent to the OLED
    wvalue: 0x0300     # SET_REPORT wValue: 0x0300 = HID Feature report
    width: 128         # Panel width in pixels
    height: 64         # Panel height in pixels

  # The base station's own current values, read before device_init pushes
  # anything, so settings never chosen here keep what the DAC has (set in GG,
  # or on the DAC itself) instead of being reset to the defaults below.
  # Offsets index the raw frame, report id included, like response_mapping:
  # audio_settings (0x20), wireless_settings (0xB0) and ux_settings (0x80) of
  # base_arctis_nova_pro_wireless, every one confirmed on a 0x12e0 by
  # `asm-cli tools probe` (values inside the spec's ranges, the 0xB0 offsets
  # identical to the status mapping above).
  # The base keeps its settings: at start, what it reports wins (#359).
  settings_readback_wins: true
  settings_readback:
    - request: 0x0620
      starts_with: 0x0620
      mapping:
        gain: 0x04
        mic_volume: 0x11
        mic_side_tone: 0x12
        line_out: 0x13
        # The reply has one stream_main (0x16) and an unused byte at 0x17;
        # the write sends main twice, which ASM shows as left and right.
        line_out_stream_main_left_volume: 0x16
        line_out_stream_main_right_volume: 0x16
        line_out_stream_aux_volume: 0x18
    - request: 0x06b0
      starts_with: 0x06b0
      mapping:
        bluetooth_power_status: 0x02
        bluetooth_auto_mute: 0x03
        mic_led_brightness: 0x0b
        pm_shutdown: 0x0c
        wireless_mode: 0x0d
    - request: 0x0680
      starts_with: 0x0680
      mapping:
        station_home_screen_view: 0x05

  # Read-only queries for `asm-cli tools probe` (generated from the
  # spec by gg_draft.py): their raw replies check a spec layout
  # on real hardware in one pass. Constants only — nothing is set.
  probe_queries:
    - name: battery_status
      frame: [0x06, 0xb7]
      fields: {headset_battery_level: 1, charger_battery_level: 2, charging_status: 3}
    - name: audio_settings
      frame: [0x06, 0x20]
      fields: {audio_input: 1, volume: 2, device_gain: 3, surround: 4, eq_preset: 5, custom_eq_band1: 6, custom_eq_band2: 7, custom_eq_band3: 8, custom_eq_band4: 9, custom_eq_band5: 10, custom_eq_band6: 11, custom_eq_band7: 12, custom_eq_band8: 13, custom_eq_band9: 14, custom_eq_band10: 15, mic_volume: 16, sidetone: 17, line_out_mode: 18, chatmix_game: 19, chatmix_chat: 20, stream_main: 21, stream_aux: 23, stream_mic: 24}
    - name: ux_settings
      frame: [0x06, 0x80]
      fields: {dim_timer: 1, oled_brightness: 2, idle_brightness: 3, home_screen_type: 4, home_screen_mic_mute: 5, sonar_present: 6}
    - name: wireless_settings
      frame: [0x06, 0xb0]
      fields: {bt_power_default: 1, bt_call_default: 2, bt_connection_mode: 3, bt_connection_status: 4, headset_batt_level: 5, charger_batt_level: 6, transparent_level: 7, mic_muted: 8, transparency_mode: 9, muted_mic_brightness: 10, power_inactivity_timer: 11, wireless_mode: 12, radio_connection_status: 13, headset_batt_status: 14}

  settings:
    headset:
      gain:
        type: toggle
        values:
          off: 0x01
          on: 0x02
          off_label: low
          on_label: high
        default: 0x02 # high
        update_sequence: [0x06, 0x27, 'value']
    microphone:
      mic_volume:
        type: slider
        min: 0x01
        max: 0x0a
        step: 1
        min_label: mic_muted
        max_label: perc_100
        default: 0x0a # 100%
        update_sequence: [0x06, 0x37, 'value']
      mic_side_tone:
        type: button_group
        values_mapping:
          0x00: 'off'
          0x01: low
          0x02: medium
          0x03: high
        default: 0x00 # off
        update_sequence: [0x06, 0x39, 'value']
      mic_led_brightness:
        type: slider
        min: 0x01
        max: 0x0a
        step: 1
        min_label: perc_10
        max_label: perc_100
        default: 0x0a # 100%
        update_sequence: [0x06, 0xbf, 'value']
    power_management:
      pm_shutdown:
        type: slider
        min: 0x00
        max: 0x06
        step: 1
        min_label: never
        max_label: 60_minutes
        values_mapping:
          0x00: never
          0x01: 1_minutes
          0x02: 5_minutes
          0x03: 10_minutes
          0x04: 15_minutes
          0x05: 30_minutes
          0x06: 60_minutes
        default: 0x05 # 30 minutes
        update_sequence: [0x06, 0xc1, 'value']
    wireless:
      wireless_mode:
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: speed
          on_label: range
        default: 0x00 # speed
        update_sequence: [0x06, 0xc3, 'value']
    bluetooth:
      # Both plain writes per the spec, and both already read back in the
      # 0x01b0 status frame — so the controls and the readout agree from the
      # first poll. bt_call_default used to be forced to "do nothing" by a
      # hardcoded byte at every init, silently undoing whatever the user had
      # set from GG or the DAC itself.
      bluetooth_power_status:
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00
        update_sequence: [0x06, 0xb2, 'value']
      bluetooth_auto_mute:
        type: button_group
        values_mapping:
          0x00: none
          0x01: -12_db
          0x02: mute
        default: 0x00
        update_sequence: [0x06, 0xb3, 'value']
    station:
      line_out:
        type: button_group
        default: 0x01
        update_sequence: [0x06, 0x43, 'value']
        values_mapping:
          0x01: speaker
          0x02: stream
      line_out_stream_main_left_volume:
        type: slider
        min: 0
        max: 100
        step: 1
        min_label: perc_0
        max_label: perc_100
        default: 100
        visible_when:
          line_out: 2
        update_sequence: [0x06, 0x47, 'value', 'settings.line_out_stream_main_right_volume', 'settings.line_out_stream_aux_volume']
      line_out_stream_main_right_volume:
        type: slider
        min: 0
        max: 100
        step: 1
        min_label: perc_0
        max_label: perc_100
        default: 100
        visible_when:
          line_out: 2
        update_sequence: [0x06, 0x47, 'settings.line_out_stream_main_left_volume', 'value', 'settings.line_out_stream_aux_volume']
      line_out_stream_aux_volume:
        type: slider
        min: 0
        max: 100
        step: 1
        min_label: perc_0
        max_label: perc_100
        default: 100
        visible_when:
          line_out: 2
        update_sequence: [0x06, 0x47, 'settings.line_out_stream_main_left_volume', 'settings.line_out_stream_main_right_volume', 'value']
      station_home_screen_view:
        # home_screen_type (0x89): 0 detailed, 1 simple, per the spec's own
        # comment; read back from ux_settings offset 5 above.
        type: button_group
        default: 0x00
        update_sequence: [0x06, 0x89, 'value']
        values_mapping:
          0x00: detailed
          0x01: simple
    audio:
      noise_cancelling:
        type: slider
        hidden: true
        min: 0x00
        max: 0x02
        step: 1
        default: 0x00 # off
        update_sequence: [0x06, 0xbd, 'value']
      transparent_level:
        type: slider
        hidden: true
        min: 0x01
        max: 0x0a
        step: 1
        default: 0x05
        update_sequence: [0x06, 0xb9, 'value']

  status_parse:
    line_out:
      type: int_str_mapping
      values:
        0x01: speaker
        0x02: stream
    station_volume:
      type: percentage
      perc_min: 56
      perc_max: 0
    media_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    chat_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    bluetooth_powerup_state:
      type: on_off
      off: 0x00
      on: 0x01
    bluetooth_auto_mute:
      type: int_str_mapping
      values:
        0x00: off
        0x01: -12db
        0x02: on
    bluetooth_power_status:
      type: on_off
      off: 0x01
      on: 0x00
    bluetooth_connection:
      type: int_str_mapping
      values:
        0x00: off
        0x01: connected
        0x02: disconnected
    # The firmware reports nine battery levels, not a percentage: GG's own
    # translate_headset_battery_level maps 0-8 onto 0/12/25/37/50/62/75/87/100.
    # Showing "62 %" implies a precision the hardware never measured — each
    # step covers about 12 points — so the value is snapped to a round number.
    headset_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 8
      round_to: 10
    charge_slot_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 8
      round_to: 10
    transparent_noise_cancelling_level:
      type: percentage
      perc_min: 0
      perc_max: 10
    mic_status:
      type: int_str_mapping
      values:
        0x01: muted
        0x00: unmuted
    noise_cancelling:
      type: int_str_mapping
      values:
        0x00: off
        0x01: transparent
        0x02: on
    mic_led_brightness:
      type: percentage
      perc_min: 0
      perc_max: 10
    auto_off_time_minutes:
      type: int_int_mapping
      values:
        0x00: 0
        0x01: 1
        0x02: 5
        0x03: 10
        0x04: 15
        0x05: 30
        0x06: 60
    wireless_mode:
      type: int_str_mapping
      values:
        0x00: speed
        0x01: range
    wireless_pairing:
      type: int_str_mapping
      values:
        0x01: not_paired
        0x04: paired_offline
        0x08: connected
    headset_power_status:
      type: int_str_mapping
      values:
        0x01: offline
        0x02: cable_charging
        0x08: online
