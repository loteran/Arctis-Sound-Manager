device:
  name: SteelSeries Arctis 7/Pro Gaming
  # GG's own minimum spacing between commands for this firmware family.
  time_between_commands_ms: 10
  # GG's own wait after the transmitter enumerates before sending it any
  # command at all (init-sleep-length). Two PIDs share this profile with
  # different declared values (arctis-7-2018-tx: none/default,
  # arctis-pro: 1000) — using the higher one.
  init_sleep_length_ms: 1000
  vendor_id: 0x1038
  product_ids:
    - 0x1260 # Arctis 7
    - 0x12ad # Arctis 7 2019
  command_padding:
    length: 31
    position: end
    filler: 0x00

  command_transport: ctrl_output

  # Vendor HID interface (interrupt OUT endpoint available)
  command_interface_index: [5, 0]
  listen_interface_indexes: [5]

  device_init:
    - ['status.request']         # get battery
    - [0x06, 0x24]               # get chatmix
    - [0x06, 0x35, 0x01, 0x00, 'settings.mic_side_tone']  # sidetone
    - [0x06, 0x51, 'settings.pm_shutdown']                 # auto-off
    - [0x06, 0x09]               # save

  status:
    request: 0x0618
    # The dial's position is not in the battery reply, and this dongle does not
    # push it: SteelSeries' own spec declares `game_chat_status` as a read —
    # out [0x06, 0x24], back [0x06, 0x24, game, chat]. device_init asked for it
    # once and nothing asked again, so the mix ASM displayed (and applied to
    # the channel volumes) was frozen at wherever the dial stood when the
    # daemon started, and stayed there however far the user turned it (#220).
    extra_requests:
      - 0x0624
    response_mapping:
      - starts_with: 0x0618
        headset_battery_charge: 0x02

      - starts_with: 0x0624
        media_mix: 0x02
        chat_mix: 0x03

    representation:
      headset:
        - headset_battery_charge
        - chat_mix
        - media_mix


  audio:
    spatial_engine: hesuvi

  # Read-only queries for `asm-cli tools probe` (generated from the
  # spec by gg_draft.py): their raw replies check a spec layout
  # on real hardware in one pass. Constants only — nothing is set.
  probe_queries:
    - name: connection_status
      frame: [0x06, 0x14]
      fields: {connection: 1}
    - name: battery_status
      frame: [0x06, 0x18]
      fields: {battery: 1}
    - name: game_chat_status
      frame: [0x06, 0x24]
      fields: {game: 1, chat: 2}
    - name: mic_status
      frame: [0x06, 0x30]
      fields: {mic: 1}
    - name: get_mic_volume
      frame: [0x06, 0x32]
      fields: {amplitude: 2}
    - name: get_sidetone
      frame: [0x06, 0x34]
      fields: {enabled: 1, amplitude: 3}

  settings:
    microphone:
      mic_volume:
        # mic_volume (0x33): [0x06, 0x33, 0x00, amplitude 0-100], in
        # arctis7dongle (Arctis 7 and 7 2019) and in GG's page for them. Not yet tried on hardware.
        type: slider
        min: 0
        max: 100
        step: 5
        min_label: perc_0
        max_label: perc_100
        default: 100
        update_sequence: [0x06, 0x33, 0x00, 'value']
      mic_side_tone:
        type: slider
        min: 0x00
        max: 0x12
        step: 1
        min_label: off
        max_label: perc_100
        default: 0x00
        update_sequence: [0x06, 0x35, 0x01, 0x00, 'value']
    power_management:
      pm_shutdown:
        type: button_group
        values_mapping:
          0x00: never
          0x0a: 10_minutes
          0x0f: 15_minutes
          0x1e: 30_minutes
          0x3c: 60_minutes
          0x5a: 90_minutes
        default: 0x1e
        update_sequence: [0x06, 0x51, 'value']

  status_parse:
    headset_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 100
    # game/chat are a signed byte of attenuation, not a plain 0-100 level:
    # 0x00 is full volume, and the dial counts down through 0xFF...0xC0 as it
    # nears mute (reporter capture on #220). perc_min/perc_max are in the same
    # signed terms; see signed_percentage()'s docstring for the full story.
    media_mix:
      type: signed_percentage
      perc_min: -64
      perc_max: 0
    chat_mix:
      type: signed_percentage
      perc_min: -64
      perc_max: 0
