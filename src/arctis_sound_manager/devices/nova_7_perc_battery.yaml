device:
  name: SteelSeries Arctis Nova 7 (Gen 2)
  vendor_id: 0x1038
  product_ids:
    - 0x22a1 # Arctis Nova 7
    - 0x227e # Arctis Nova 7 Wireless Gen 2
    - 0x2258 # Arctis Nova 7X v2
    - 0x229e # Arctis Nova 7X v2 (variant)
    - 0x22a9 # Arctis Nova 7 Diablo IV Gen 2
    - 0x22a5 # Arctis Nova 7X Gen 2
    - 0x22ad # Arctis Nova 7X White (upgrade revision)
    # Was in nova_7_discrete_battery.yaml, added as "same device as 0x227a,
    # different PID" from a bare user report. Its own spec says otherwise:
    # arctis_nova_7_wow_upgrade_tx.device includes base_arctis_nova_7_gen2_tx
    # (battery `range 1 100`), its get-main-product-id resolves to
    # arctis_nova_7_gen2_tx_id, and the upgrade include redefines no part of
    # headset_status. It is the WoW dongle *after* the firmware update, which
    # switches it to the Gen 2 protocol — 0x227a, the same headset before the
    # update, does include base_arctis_nova_7_tx and stays in the Gen 1
    # profile. Read as Gen 1 its battery byte was divided by a 0-4 scale, so a
    # real 76 % rendered as 1900 % (percentage() does not clamp).
    - 0x22ab # Arctis Nova 7 WoW Edition (post-upgrade firmware)
  command_padding:
    length: 64
    position: end
    filler: 0x00

  command_transport: ctrl_output  # HID SET_REPORT (no interrupt OUT endpoint)
  # The HID usage page the vendor interface declares, from this device's
  # own (sync-interface 0xff00 …). ASM resolves the interface number
  # from it rather than trusting the one below (#213).
  hid_usage_page: 0xff00
  command_interface_index: [3, 0]
  # 5 as well as 3: the dial pushes its ChatMix frames (0x45 <game> <chat>) on
  # interface 5, while 3 only carries the polled 0xb0 status frame. Confirmed
  # on 0x22a1 by a reporter running both ASM and rust-arctis-chatmix on the
  # same headset, whose hardware-verified device table lists interface 5 for
  # this family (#211).
  #
  # ASM did reach interface 5, but by runtime detection alone: a dial frame
  # arriving on a candidate interface gets that interface cached (see
  # listen_endpoint_loop). Listing it here means the dial answers on the first
  # turn instead of after the detection has got lucky once, and it survives the
  # cache being cleared. A model in this family with no interface 5 costs one
  # warning and no reads.
  listen_interface_indexes: [3, 5]

  device_init:
    - [0x10]
    - ['status.request']
    - [0xa3, 'settings.pm_shutdown']
    - [0xb2, 0x00]
    - [0x3a, 'settings.volume_limiter']
    - [0xae, 'settings.mic_mute_led_brightness']
    - [0x37, 'settings.mic_volume']
    - [0xb3, 'settings.bluetooth_auto_mute']
    - [0x39, 'settings.mic_side_tone']
    - [0x09]
    - ['status.request']
    - [0x09]

  status:
    request: 0xb0
    response_mapping:
      - starts_with: 0x45
        media_mix: 0x01
        chat_mix: 0x02

      # Every offset here is the spec's field index minus one (ASM's buffers
      # carry no report id): connection_status 2→0x01, battery 3→0x02,
      # charging 4→0x03, game_chatmix 5→0x04, chat_chatmix 6→0x05,
      # bt_power_default 8→0x07, bt_call_default 9→0x08, mic_mute 10→0x09.
      # See `(struct headset_status)` in base_arctis_nova_7_gen2_tx.device.
      #
      # 0x06 is missing from that list on purpose: the spec declares
      # `(field unused bytearray (size 1))` there. It was read as
      # bluetooth_connection, so the indicator showed padding — plausible,
      # never real. The headset does report its Bluetooth link, but through
      # the 0xB5 push on the sync interface, not in this frame; mapping that
      # needs an observed frame first, as the offsets in this family's push
      # frames have already proven not to match the spec elsewhere.
      - starts_with: 0xb0
        headset_power_status: 0x01
        headset_battery_charge: 0x02
        cable_charging: 0x03
        media_mix: 0x04
        chat_mix: 0x05
        bluetooth_power_status: 0x07
        bluetooth_auto_mute: 0x08
        mic_status: 0x09

    representation:
      headset:
        - headset_power_status
        - headset_battery_charge
        - chat_mix
        - media_mix
        - cable_charging
      mic:
        - mic_status
      bluetooth:
        - bluetooth_power_status
        - bluetooth_auto_mute

  # On-device parametric EQ (parametric_eq, opcode 0xA7). Unlike the Nova Pro
  # families this is not a run of gain bytes: each band carries a frequency,
  # filter type, gain in decidecibels and Q, sent over three frames the last of
  # which commits the curve. See hardware_eq.py.
  # Ask the headset for its own current values at init. Offsets are indexed
  # like a status response_mapping (no report id): 0x20 replies with mic
  # volume, sidetone and volume limiter, 0xa0 with the inactivity timer and
  # the muted-mic LED brightness. These only fill in settings the user has
  # never chosen here — a headset configured in GG on a dual-boot keeps what
  # it had instead of being flattened to our defaults.
  settings_readback:
    - request: 0x20
      starts_with: 0x20
      mapping:
        mic_volume: 0x01
        mic_side_tone: 0x02
        volume_limiter: 0x03
    - request: 0xa0
      starts_with: 0xa0
      mapping:
        pm_shutdown: 0x01
        mic_mute_led_brightness: 0x02

  hardware_eq:
    format: parametric
    name_command: 0xa7
    band_command: 0x33
    commit_command: 0x27
    # Read the curve back from the headset (issue #146, reported on the Nova
    # 7P Gen 2 but this family shares the same base_arctis_nova_7_gen2_tx.device
    # spec, opcodes and all). get_eq_preset_data (0x32) and read_eq_preset_name
    # (0xA6). connection_type defaults to 0x00 (wireless), the slot the
    # Custom EQ sliders write to. See hardware_eq.decode_eq_preset_data() for
    # the firmware byte-count quirk this reply has.
    readback:
      band_query: 0x32
      name_query: 0xa6

  online_status:
    status_variable: headset_power_status
    online_value: online

  audio:
    spatial_engine: hesuvi

  settings:
    headset:
      volume_limiter:
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00
        update_sequence: [0x3a, 'value']
      bluetooth_auto_mute:
        type: button_group
        values_mapping:
          0x00: none
          0x01: -12_db
          0x02: mute
        default: 0x00
        update_sequence: [0xb3, 'value']
      bluetooth_power_status:
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00
        update_sequence: [0xb2, 'value']
    microphone:
      mic_volume:
        type: slider
        min: 0x00
        max: 0x07
        step: 1
        min_label: mic_muted
        max_label: perc_100
        default: 0x07
        update_sequence: [0x37, 'value']
      mic_side_tone:
        type: button_group
        values_mapping:
          0x00: off
          0x01: low
          0x02: medium
          0x03: high
        default: 0x00
        update_sequence: [0x39, 'value']
      mic_mute_led_brightness:
        type: button_group
        values_mapping:
          0x00: off
          0x01: low
          0x02: medium
          0x03: high
        default: 0x03
        update_sequence: [0xae, 'value']
    power_management:
      pm_shutdown:
        type: button_group
        values_mapping:
          0x00: never
          0x01: 1_minute
          0x05: 5_minutes
          0x0a: 10_minutes
          0x0f: 15_minutes
          0x1e: 30_minutes
          0x2d: 45_minutes
          0x3c: 60_minutes
          0x4b: 75_minutes
          0x5a: 90_minutes
        default: 0x1e
        update_sequence: [0xa3, 'value']

  status_parse:
    headset_power_status:
      type: on_off
      off: 0x02
      on: 0x03
    headset_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 100
    cable_charging:
      # SteelSeries' own translate_charging_status, identical across every
      # Arctis family: 0 unknown / 1 charging / 2 plugged in but not charging
      # / 3 on battery. 0x00 and 0x02 used to be unmapped, so the indicator
      # simply vanished once the headset finished charging on the cable.
      type: int_str_mapping
      values:
        0x00: unknown
        0x01: on
        0x02: plugged_not_charging
        0x03: off
    media_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    chat_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    bluetooth_power_status:
      type: on_off
      off: 0x01
      on: 0x00
    bluetooth_auto_mute:
      type: int_str_mapping
      values:
        0x00: off
        0x01: -12db
        0x02: on
    mic_status:
      type: int_str_mapping
      values:
        0x01: muted
        0x00: unmuted
