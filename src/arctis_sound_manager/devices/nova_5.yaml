device:
  name: SteelSeries Arctis Nova 5 Wireless
  vendor_id: 0x1038
  product_ids:
    - 0x2232 # Arctis Nova 5
    - 0x2253 # Arctis Nova 5X
    - 0x2255 # Arctis Nova 5X (variant)
    - 0x2264 # Arctis Nova 5X (rev2)
  command_padding:
    length: 64
    position: end
    filler: 0x00

  command_transport: ctrl_output  # HID SET_REPORT (no interrupt OUT endpoint)
  command_interface_index: [3, 0]
  # 5 as well as 3, which is what upstream has had all along. This profile was
  # written with [3] when the family was added (2026-04-03) and the 5 was lost
  # in the copy: elegos/Linux-Arctis-Manager lists [3, 5] for the Nova 5, and
  # it is the same split the Nova 7 Gen 2 turned out to need (#211), the dial
  # pushing on 5 while 3 carries only the polled status frame.
  #
  # Restored from upstream rather than measured: nobody here has a Nova 5. The
  # downside is bounded, an interface a model does not expose costs one warning
  # and no reads, while leaving it out means the dial works only when the
  # runtime detection happens to catch a frame on a candidate interface.
  listen_interface_indexes: [3, 5]

  device_init:
    - ['status.request']
    - [0x10]
    - [0x36]
    - [0xae, 'settings.mic_mute_led_brightness']
    - [0x37, 'settings.mic_volume']
    - [0xa3, 'settings.pm_shutdown']
    - [0xa7]
    - [0x27, 'settings.volume_limiter']
    - [0x39, 'settings.mic_side_tone']
    - [0x09]
    - [0x09]
    - ['status.request']

  status:
    request: 0xb0
    response_mapping:
      # Offset 0x02 is the spec's `(field unused uint8)` — see
      # base_arctis_nova_5_tx.device, `(struct headset_status)`. It used to be
      # read as bluetooth_connection, which is doubly wrong: the byte carries
      # nothing, and this headset has no Bluetooth at all (the profile
      # declares no Bluetooth setting either). What it displayed was padding,
      # dressed up as a connection state.
      #
      # The remaining offsets follow the -1 shift the rest of this frame
      # confirms: connection_status 2→0x01, battery_status 4→0x03,
      # charging_status 5→0x04. The spec also carries game_chatmix_level /
      # chat_chatmix_level at 0x05 / 0x06, which ASM does not read yet.
      - starts_with: 0xb0
        headset_power_status: 0x01
        headset_battery_charge: 0x03
        cable_charging: 0x04

      - starts_with: 0x36
        wireless_mode: 0x01

    representation:
      headset:
        - headset_power_status
        - headset_battery_charge
        - cable_charging
      wireless:
        - wireless_mode

  # On-device parametric EQ (parametric_eq, opcode 0xA5). Same shape as the
  # Nova 7 Gen 2 but with no commit frame: the spec declares no
  # update_complete opcode, so the curve applies with the bands.
  hardware_eq:
    format: parametric
    name_command: 0xa5
    band_command: 0x33
    # Unlike the Nova 7 Gen 2, the band frame does not repeat the connection
    # byte — including it would shift the whole curve by one byte.
    bands_carry_connection: false
    # GG raises its inter-command delay to 600 ms between the name and the
    # bands for this family, and its USB timeout with it.
    frame_delay_ms: 600

  online_status:
    status_variable: headset_power_status
    online_value: online

  audio:
    spatial_engine: hesuvi

  settings:
    headset:
      volume_limiter:
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00
        update_sequence: [0x27, 'value']
    microphone:
      mic_volume:
        type: slider
        min: 0x00
        max: 0x0f
        step: 1
        min_label: mic_muted
        max_label: perc_100
        default: 0x0f
        update_sequence: [0x37, 'value']
      mic_side_tone:
        # GG declares sidetone as level 0-10; the slider went to 15, so its top
        # third sent values the firmware has no meaning for.
        type: slider
        min: 0x00
        max: 0x0a
        step: 1
        min_label: off
        max_label: perc_100
        default: 0x00
        update_sequence: [0x39, 'value']
      mic_mute_led_brightness:
        # Wire values are 0 / 1 / 4 / 10, NOT 0-3: GG's UI works on a 0-3 scale
        # and its transform_frontend_mic_muted_brightness_to_firmware_value maps
        # it to these before sending. The struct's `range 0 3` describes GG's own
        # API, not what goes out on USB — do not "fix" this to 0-3.
        type: button_group
        values_mapping:
          0x00: off
          0x01: low
          0x04: medium
          0x0a: high
        default: 0x0a
        update_sequence: [0xae, 'value']
    wireless:
      wireless_mode:
        type: button_group
        values_mapping:
          0x01: speed
          0x00: range
        default: 0x01
        update_sequence: [0x35, 'value']
    power_management:
      pm_shutdown:
        type: button_group
        values_mapping:
          0x00: never
          0x01: 1_minute
          0x05: 5_minutes
          0x0a: 10_minutes
          0x0f: 15_minutes
          0x1e: 30_minutes
          0x2d: 45_minutes
          0x3c: 60_minutes
          0x4b: 75_minutes
          0x5a: 90_minutes
        default: 0x1e
        update_sequence: [0xa3, 'value']

  status_parse:
    headset_power_status:
      type: on_off
      off: 0x02
      on: 0x03
    headset_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 100
    cable_charging:
      # SteelSeries' own translate_charging_status, identical across every
      # Arctis family: 0 unknown / 1 charging / 2 plugged in but not charging
      # / 3 on battery. 0x00 and 0x02 used to be unmapped, so the indicator
      # simply vanished once the headset finished charging on the cable.
      type: int_str_mapping
      values:
        0x00: unknown
        0x01: on
        0x02: plugged_not_charging
        0x03: off
    wireless_mode:
      type: int_str_mapping
      values:
        0x00: range
        0x01: speed
