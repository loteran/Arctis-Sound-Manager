device:
  name: SteelSeries Arctis Nova 7P (Gen 2)
  vendor_id: 0x1038
  product_ids:
    - 0x22a7 # Arctis Nova 7P V2 (firmware after Jan. 2026 update — percentage battery 0-100)
    - 0x2298 # Arctis Nova 7P Gen 2 (#146)
  command_padding:
    length: 64
    position: end
    filler: 0x00

  command_transport: ctrl_output
  # The HID usage page the vendor interface declares, from this device's
  # own (sync-interface 0xff00 …). ASM resolves the interface number
  # from it rather than trusting the one below (#213).
  hid_usage_page: 0xff00
  command_interface_index: [3, 0]
  # Interface 3 carries commands and their polled replies (it is the one
  # matching the spec's `(usage-page 0xFFC0)`). Interface 5 is a second,
  # separate one: `arctis_nova_7p_gen2_tx.device` declares
  # `(sync-interface 0xff00 0x0001 5)`, and `translate_sync_data` in the shared
  # base spec lists what arrives there — 0x52 mic mute, 0x45 ChatMix (both
  # levels), 0xB7/0xB9/0xBB battery/connection/charging, 0xB5 Bluetooth, and
  # the headset's own echo of the parametric EQ frames (0x33 / 0xA7 / 0x27).
  # Listening on 3 alone, ASM learned all of that only from the 0xB0 poll and
  # never saw the EQ acknowledgements at all (#146).
  #
  # These are two different roles, not a contradiction: that ASM writes
  # successfully on interface 3 says nothing about interface 5. The same split
  # was confirmed on real hardware for the Nova 3 Wireless in #149, where the
  # pushes landed on 5 and only the polled 0xB0 came back on 3.
  #
  # Listening on 5 as well is held back until someone confirms it on real
  # hardware. Taking a second interface means detaching it from the kernel,
  # which can cost the dongle its media keys, and a mis-claimed interface is
  # how the headset ends up wedged in a loop of EIO. This profile also covers
  # PID 0x22a7, which no GG 115 spec describes at all — so there is nothing to
  # check that one against. Worth doing, but not worth shipping blind: the
  # frames it would expose are a diagnostic aid, not a fix anyone is waiting on.
  listen_interface_indexes: [3]

  # Nova 7P inherits Nova 7 protocol. Sidetone has no effect on this device.
  # ChatMix dial controls sidetone physically but the setting does nothing — excluded.
  device_init:
    - [0x10]
    - ['status.request']
    - [0xa3, 'settings.pm_shutdown']
    - [0xb2, 0x00]
    - [0x3a, 'settings.volume_limiter']
    - [0xae, 'settings.mic_mute_led_brightness']
    - [0x37, 'settings.mic_volume']
    - [0xb3, 'settings.bluetooth_auto_mute']
    - [0x09]
    - ['status.request']
    - [0x09]

  status:
    request: 0xb0
    response_mapping:
      # Offsets are the spec's field index minus one (ASM's buffers carry no
      # report id) — `(struct headset_status)` in
      # base_arctis_nova_7_gen2_tx.device, the spec this family shares with
      # the Nova 7 Gen 2.
      #
      # 0x06 is deliberately absent: the spec declares
      # `(field unused bytearray (size 1))` there, and it was read as
      # bluetooth_connection, so the indicator showed padding rather than any
      # real link state. The headset does report its Bluetooth connection, on
      # the 0xB5 push over the sync interface — mapping that needs a frame
      # someone has actually observed, since this family's push offsets have
      # already been shown not to follow the spec.
      #
      # Offsets 0x04 / 0x05 hold game_chatmix_level / chat_chatmix_level and
      # stay unread here: on this hardware the wheel is repurposed to sidetone
      # (see the note above device_init), unlike the non-P Nova 7 Gen 2.
      - starts_with: 0xb0
        headset_power_status: 0x01
        headset_battery_charge: 0x02
        cable_charging: 0x03
        bluetooth_power_status: 0x07
        bluetooth_auto_mute: 0x08
        mic_status: 0x09

    representation:
      headset:
        - headset_power_status
        - headset_battery_charge
        - cable_charging
      mic:
        - mic_status
      bluetooth:
        - bluetooth_power_status
        - bluetooth_auto_mute

  # On-device parametric EQ (parametric_eq, opcode 0xA7). Unlike the Nova Pro
  # families this is not a run of gain bytes: each band carries a frequency,
  # filter type, gain in decidecibels and Q, sent over three frames the last of
  # which commits the curve. See hardware_eq.py.
  # Ask the headset for its own current values at init. Offsets are indexed
  # like a status response_mapping (no report id): 0x20 replies with mic
  # volume, sidetone and volume limiter, 0xa0 with the inactivity timer and
  # the muted-mic LED brightness. These only fill in settings the user has
  # never chosen here — a headset configured in GG on a dual-boot keeps what
  # it had instead of being flattened to our defaults.
  settings_readback:
    - request: 0x20
      starts_with: 0x20
      mapping:
        mic_volume: 0x01
        mic_side_tone: 0x02
        volume_limiter: 0x03
    - request: 0xa0
      starts_with: 0xa0
      mapping:
        pm_shutdown: 0x01
        mic_mute_led_brightness: 0x02

  hardware_eq:
    format: parametric
    name_command: 0xa7
    band_command: 0x33
    commit_command: 0x27
    # Read the curve back from the headset (issue #146: sliders move, headset
    # is silent — this is how to tell "the curve never arrived" from "it
    # arrived but isn't applied"). get_eq_preset_data (0x32) and
    # read_eq_preset_name (0xA6), both declared in the spec this family
    # shares with the Nova 7 Gen 2 (base_arctis_nova_7_gen2_tx.device).
    # connection_type defaults to 0x00 (wireless), the same slot the Custom
    # EQ sliders write to. This readback is what proved the curve was never
    # arriving: the headset answered with its factory Flat preset while a
    # custom curve was set. Real replies from this model are pinned in
    # tests/test_hardware_eq_readback.py.
    readback:
      band_query: 0x32
      name_query: 0xa6

  online_status:
    status_variable: headset_power_status
    online_value: online

  audio:
    spatial_engine: hesuvi

  settings:
    headset:
      volume_limiter:
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00
        update_sequence: [0x3a, 'value']
      bluetooth_auto_mute:
        type: button_group
        values_mapping:
          0x00: none
          0x01: -12_db
          0x02: mute
        default: 0x00
        update_sequence: [0xb3, 'value']
      bluetooth_power_status:
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00
        update_sequence: [0xb2, 'value']
    microphone:
      mic_volume:
        type: slider
        min: 0x00
        max: 0x07
        step: 1
        min_label: mic_muted
        max_label: perc_100
        default: 0x07
        update_sequence: [0x37, 'value']
      mic_mute_led_brightness:
        type: button_group
        values_mapping:
          0x00: off
          0x01: low
          0x02: medium
          0x03: high
        default: 0x03
        update_sequence: [0xae, 'value']
    power_management:
      pm_shutdown:
        type: button_group
        values_mapping:
          0x00: never
          0x01: 1_minute
          0x05: 5_minutes
          0x0a: 10_minutes
          0x0f: 15_minutes
          0x1e: 30_minutes
          0x2d: 45_minutes
          0x3c: 60_minutes
          0x4b: 75_minutes
          0x5a: 90_minutes
        default: 0x1e
        update_sequence: [0xa3, 'value']

  status_parse:
    headset_power_status:
      type: on_off
      off: 0x02
      on: 0x03
    headset_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 100
    cable_charging:
      # SteelSeries' own translate_charging_status, identical across every
      # Arctis family: 0 unknown / 1 charging / 2 plugged in but not charging
      # / 3 on battery. 0x00 and 0x02 used to be unmapped, so the indicator
      # simply vanished once the headset finished charging on the cable.
      type: int_str_mapping
      values:
        0x00: unknown
        0x01: on
        0x02: plugged_not_charging
        0x03: off
    bluetooth_power_status:
      type: on_off
      off: 0x01
      on: 0x00
    bluetooth_auto_mute:
      type: int_str_mapping
      values:
        0x00: off
        0x01: -12db
        0x02: on
    mic_status:
      type: int_str_mapping
      values:
        0x01: muted
        0x00: unmuted
