name: Publish pacman repository

# Builds the Arch package from aur/PKGBUILD and publishes it, signed, as a
# binary pacman repository hosted on a fixed GitHub release (tag: pacman-repo).
#
# Why this exists alongside the AUR package: Discover, GNOME Software and every
# other AppStream front-end talk to PackageKit, and PackageKit's alpm backend
# only ever sees repositories listed in /etc/pacman.conf. The AUR is invisible
# to it. A binary repository is the only way an Arch/CachyOS user can find and
# install ASM from a graphical software centre.
#
# One dependency lives in the AUR rather than the official repositories
# (python-pulsectl), so pacman could not satisfy it from extra/ alone. It is
# rebuilt here and shipped in the same repository, otherwise installing on plain
# Arch fails on an unresolvable dependency. Distributions carrying their own
# copy (CachyOS does) keep it: ours is only used where it is missing.

# Called by release.yaml at the end of a release, exactly like pypi-publish.
# It is NOT triggered by `on: release` — the GitHub release is created with the
# default GITHUB_TOKEN, and events raised by that token deliberately do not
# start further workflows, so an `on: release` trigger here would never fire.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.2.14)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.2.14)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build tooling
        run: |
          pacman -Syu --noconfirm --needed git python-installer uv github-cli openssh

      - name: Resolve tag and version
        id: ver
        run: |
          TAG="${{ inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - name: Create build user
        run: |
          # makepkg refuses to run as root, by design.
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build arctis-sound-manager
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /repo && chown builder:builder /repo
          cd aur
          # The PKGBUILD in the repository still carries the previous version
          # until sync-packaging-version regenerates it, and it may run after
          # this workflow. Pin it to the tag being released.
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          # -d skips the dependency check: every runtime dependency is resolved
          # on the user's machine at install time, and one of them is not in the
          # official repositories anyway. The package is arch=any pure Python, so
          # nothing in the build itself needs them.
          sudo -u builder makepkg -dcf --noconfirm --nosign
          cp ./*.pkg.tar.zst /repo/

      - name: Build AUR-only dependencies
        # NOT step-level continue-on-error: python-pulsectl is a hard
        # dependency (ASM cannot run without it — see the module comment
        # above), so its build failing must fail this job, or a fresh Arch
        # install becomes silently unresolvable (the #178 pattern, applied to
        # the package ASM cannot run without). noise-suppression-for-voice
        # stays soft: it is an optdepend the install no longer needs, and a
        # broken upstream build for it must not hold back the release of ASM
        # itself. The script below only exits non-zero when a HARD dependency
        # fails, so soft failures keep behaving exactly as before.
        run: |
          set -uo pipefail

          # GCC 15 stopped pulling <cstdint> in transitively, and
          # noise-suppression-for-voice 0.91 — the AUR's current release —
          # still relies on that: common/include/common/RnNoiseCommonPlugin.h
          # uses int32_t without including it, so the build dies with
          # "'int32_t' has not been declared". Being continue-on-error, that
          # failure was only a warning in the log, and v1.2.26 shipped a
          # repository without the mic noise-cancel plugin it had just promised
          # `pacman -S` would provide (issue #175).
          #
          # Force the header in for every C++ translation unit rather than
          # patching a source file we do not control. ~/.makepkg.conf is
          # sourced after /etc/makepkg.conf, so this appends to the distro
          # flags instead of replacing them, and it is a no-op for the pure
          # Python packages built here.
          printf 'CXXFLAGS+=" -include cstdint"\n' > /home/builder/.makepkg.conf
          chown builder:builder /home/builder/.makepkg.conf

          # python-pulsectl is a hard dependency (ASM can't run without it) so
          # it MUST be here — its build failing fails this job (see below).
          # noise-suppression-for-voice is an optdepend — the install no
          # longer needs it, but shipping it lets users add the ClearCast mic
          # noise-cancel with one `pacman -S` from this same repo, so its
          # build failing only warns.
          HARD_DEPS="python-pulsectl"

          failed=""
          hard_failed=""
          for pkg in python-pulsectl noise-suppression-for-voice; do
            is_hard=0
            for h in $HARD_DEPS; do [ "$h" = "$pkg" ] && is_hard=1; done

            if ! sudo -u builder git clone --depth 1 \
                "https://aur.archlinux.org/${pkg}.git" "/tmp/${pkg}"; then
              failed="$failed $pkg"
              if [ "$is_hard" -eq 1 ]; then
                hard_failed="$hard_failed $pkg"
                echo "::error::Could not clone hard dependency $pkg — a fresh install would be unresolvable."
              fi
              continue
            fi
            # An epoch puts a colon in the package filename, and GitHub rewrites
            # colons in release asset names — pacman would then request a file
            # that does not exist under that name and fail with 404. Dropping it
            # is safe here: this repository has no version history to preserve,
            # and where the AUR build is already installed its epoch keeps it
            # winning, so nothing is downgraded behind the user's back.
            sudo -u builder sed -i '/^epoch=/d' "/tmp/${pkg}/PKGBUILD"
            if ( cd "/tmp/${pkg}" && sudo -u builder makepkg -scf --noconfirm --nosign ); then
              cp "/tmp/${pkg}"/*.pkg.tar.zst /repo/
            else
              failed="$failed $pkg"
              if [ "$is_hard" -eq 1 ]; then
                hard_failed="$hard_failed $pkg"
                echo "::error::Could not build hard dependency $pkg — a fresh install would be unresolvable."
              else
                echo "::warning::Could not build $pkg — the repository will ship without it."
              fi
            fi
          done
          [ -z "$failed" ] || echo "AUR dependencies not built:$failed" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$hard_failed" ]; then
            echo "::error::Hard AUR dependency build(s) failed:$hard_failed — a fresh install would be unresolvable. Failing this job."
            exit 1
          fi

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --keyid-format long \
                   | awk '/^sec/ {print $2}' | cut -d/ -f2 | head -1)
          echo "GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          # Published alongside the repository so users can verify it without
          # depending on a keyserver being reachable.
          gpg --armor --export "$KEY_ID" > /repo/arctis-sound-manager.key

      - name: Sign packages and build the database
        run: |
          set -euo pipefail
          cd /repo
          # makepkg emits a -debug companion package when debug symbols are on;
          # it is dead weight in a repository meant for users.
          rm -f ./*-debug-*.pkg.tar.zst
          for f in *.pkg.tar.zst; do
            gpg --batch --yes --detach-sign --no-armor --local-user "$GPG_KEY_ID" "$f"
          done
          repo-add --sign --key "$GPG_KEY_ID" \
            arctis-sound-manager.db.tar.gz ./*.pkg.tar.zst
          # repo-add leaves .db and .files as symlinks to the .tar.gz archives.
          # A GitHub release stores plain files, and pacman fetches the
          # extension-less names, so materialise them.
          # --remove-destination: repo-add already created $l as a symlink to
          # $l.tar.gz, so a plain cp would refuse to copy a file onto itself.
          for l in arctis-sound-manager.db arctis-sound-manager.files; do
            cp -L --remove-destination "$l.tar.gz" "$l"
            cp -L --remove-destination "$l.tar.gz.sig" "$l.sig"
          done
          ls -la

      - name: Publish to the pacman-repo release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          cd /repo
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          cat > /tmp/notes.md <<'NOTES'
          Binary pacman repository for Arch Linux, CachyOS, EndeavourOS and other
          Arch derivatives — the one form of the package a graphical software
          centre (Discover, GNOME Software) can see, since PackageKit cannot read
          the AUR.

          Setup is handled by the installer:

              curl -fsSL https://loteran.github.io/Arctis-Sound-Manager/install.sh | bash

          Or by hand — trust the signing key, add the repository, install:

              curl -fsSL https://github.com/loteran/Arctis-Sound-Manager/releases/download/pacman-repo/arctis-sound-manager.key -o /tmp/asm.key
              sudo pacman-key --add /tmp/asm.key
              sudo pacman-key --lsign-key "$(gpg --show-keys --with-colons /tmp/asm.key | awk -F: '/^fpr/ {print $10; exit}')"
              sudo tee -a /etc/pacman.conf <<'EOF'

              [arctis-sound-manager]
              Server = https://github.com/loteran/Arctis-Sound-Manager/releases/download/pacman-repo
              EOF
              sudo pacman -Sy arctis-sound-manager

          This release is a moving target: its assets are replaced on every
          version so the Server URL never changes. Do not delete it, and do not
          expect its tag to describe the version it holds.
          NOTES
          sed -i 's/^          //' /tmp/notes.md

          if ! gh release view pacman-repo --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create pacman-repo \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --latest=false \
              --title "pacman repository" \
              --notes-file /tmp/notes.md
          else
            gh release edit pacman-repo --repo "$GITHUB_REPOSITORY" \
              --notes-file /tmp/notes.md
          fi

          # api.github.com answers a transient 503 often enough that a single
          # attempt is not good enough here: v1.2.26 lost its whole database
          # upload to one (issue #178), leaving the packages published but the
          # repository still advertising the previous version — pacman reads
          # the database, so every Arch user stayed on 1.2.25 with no sign
          # anything had gone wrong.
          retry() {
            n=0
            until "$@"; do
              n=$((n + 1))
              [ "$n" -lt 5 ] || { echo "::error::giving up after $n attempts: $*"; return 1; }
              echo "::warning::attempt $n failed, retrying in $((n * 10))s: $*"
              sleep $((n * 10))
            done
          }

          # --clobber: one asset set at a time, replaced in place, so a user's
          # Server line keeps working across every release.
          #
          # Packages first, database last, each uploaded on its own: the
          # database is the index pacman resolves against, so it must never
          # name a package that is not published yet. Uploading it last means
          # an interrupted run leaves the previous, coherent repository intact
          # rather than a database pointing at 404s.
          for f in *.pkg.tar.zst *.pkg.tar.zst.sig arctis-sound-manager.key; do
            [ -f "$f" ] || continue
            retry gh release upload pacman-repo "$f" \
              --repo "$GITHUB_REPOSITORY" --clobber
          done
          for f in arctis-sound-manager.db arctis-sound-manager.db.sig \
                   arctis-sound-manager.db.tar.gz arctis-sound-manager.db.tar.gz.sig \
                   arctis-sound-manager.files arctis-sound-manager.files.sig \
                   arctis-sound-manager.files.tar.gz arctis-sound-manager.files.tar.gz.sig; do
            [ -f "$f" ] || continue
            retry gh release upload pacman-repo "$f" \
              --repo "$GITHUB_REPOSITORY" --clobber
          done

          # --clobber only replaces same-named assets, so last version's
          # packages would pile up forever — and a filename GitHub rewrote (it
          # strips colons) would linger unreferenced by any database.
          #
          # Housekeeping only: the repository is already complete and coherent
          # at this point, and a stale extra package hurts nobody (the database
          # never names it). Never fail the job — and with it the release — over
          # a leftover file.
          gh release view pacman-repo --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | while read -r asset; do
            [ -f "$asset" ] || retry gh release delete-asset pacman-repo "$asset" \
              --repo "$GITHUB_REPOSITORY" -y || \
              echo "::warning::could not remove stale asset $asset — harmless, no database references it."
          done || true

      - name: Summary
        run: |
          echo "Published pacman repository for ${{ steps.ver.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```ini' >> "$GITHUB_STEP_SUMMARY"
          echo '[arctis-sound-manager]' >> "$GITHUB_STEP_SUMMARY"
          echo 'Server = https://github.com/loteran/Arctis-Sound-Manager/releases/download/pacman-repo' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
