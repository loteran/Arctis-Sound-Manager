name: AUR retry (poll until maintenance ends)

# One-shot recovery poller. The normal AUR push lives in release.yaml; this
# exists only for the case where AUR git is under maintenance at release time,
# so the push fails through no fault of ours (aur@aur.archlinux.org answers
# "The AUR is down due to maintenance" to git-upload-pack while SSH auth and the
# read-only RPC both keep working). It polls on a schedule and, the moment AUR
# git is reachable again, pushes the version the repo's aur/PKGBUILD declares —
# then disables itself so it does not keep polling forever.
#
# Re-enable it (Actions tab → this workflow → Enable) if a later release hits
# the same maintenance window.

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min
  workflow_dispatch:

concurrency:
  group: aur-retry
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # to disable this workflow once the push lands

jobs:
  retry:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up SSH for AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # printf (not echo) + IdentitiesOnly to avoid any stray-CR / wrong-key surprises.
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur_key\n  IdentitiesOnly yes\n  User aur\n' >> ~/.ssh/config

      - name: Is AUR git reachable?
        id: up
        run: |
          if git ls-remote ssh://aur@aur.archlinux.org/arctis-sound-manager.git HEAD >/dev/null 2>&1; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUR git still unreachable (maintenance) — will retry next tick."
          fi

      - name: Push update to AUR
        id: push
        if: steps.up.outputs.up == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^pkgver=' aur/PKGBUILD | cut -d= -f2)

          # aur/PKGBUILD on main is regenerated by sync-packaging-version, which
          # runs *after* the release job that arms this poller. Pushing whatever
          # it happens to say right now — and then disabling ourselves, as the
          # step below does on success — would strand the AUR one version behind
          # with nothing left polling. Only act once main has caught up with the
          # latest published release.
          LATEST=$(gh release view --repo "${{ github.repository }}" \
                     --json tagName --jq '.tagName' | sed 's/^v//')
          if [ "$VERSION" != "$LATEST" ]; then
            echo "::notice::aur/PKGBUILD is at ${VERSION} but the latest release is ${LATEST} — packaging sync has not landed yet, retrying next tick."
            exit 0
          fi

          # Pin the branch rather than follow the remote HEAD (issue #229): the
          # AUR repo's HEAD drifted onto an orphaned commit, so a plain clone
          # lands detached, the commit below is made on no branch, and the push
          # fails. That is what stopped this retry job from being able to repair
          # anything, including the drift itself.
          git clone ssh://aur@aur.archlinux.org/arctis-sound-manager.git /tmp/aur
          git -C /tmp/aur checkout -B master origin/master
          CUR=$(grep '^pkgver=' /tmp/aur/PKGBUILD | cut -d= -f2 || echo "")
          if [ "$CUR" = "$VERSION" ]; then
            echo "::notice::AUR already at ${VERSION} — nothing to push."
            echo "done=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Real sha256 of the release source tarball (PKGBUILD/.SRCINFO carry SKIP).
          URL="https://github.com/loteran/Arctis-Sound-Manager/releases/download/v${VERSION}/arctis-sound-manager-${VERSION}.tar.gz"
          curl -fsSL "$URL" -o /tmp/src.tar.gz
          SHA=$(sha256sum /tmp/src.tar.gz | cut -d' ' -f1)

          sed "s/sha256sums=('[^']*')/sha256sums=('${SHA}')/" aur/PKGBUILD > /tmp/aur/PKGBUILD
          sed "s/sha256sums = .*/sha256sums = ${SHA}/"        aur/.SRCINFO > /tmp/aur/.SRCINFO
          cp aur/arctis-sound-manager.install /tmp/aur/arctis-sound-manager.install

          cd /tmp/aur
          git config user.name "loteran"
          git config user.email "29098776+loteran@users.noreply.github.com"
          git add PKGBUILD .SRCINFO arctis-sound-manager.install
          if git diff --cached --quiet; then
            echo "::notice::No changes to push."
          else
            git commit -m "Update to v${VERSION}"
            git push origin HEAD:refs/heads/master
            echo "::notice::Pushed v${VERSION} to AUR."
          fi
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Disable this poller (goal reached)
        if: steps.push.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable aur-retry.yaml --repo "${{ github.repository }}" \
            && echo "aur-retry disabled — AUR is up to date." \
            || echo "Could not auto-disable (non-fatal); disable it by hand in the Actions tab."
